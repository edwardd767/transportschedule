name: Replace Availability icon

on:
  push:
    paths:
      - '.github/workflows/replace-availability-icon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Replace Availability toolbar icon
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/bookings.tsx')
          text = path.read_text()

          marker = "function PersonIcon({ size = 18 }: { size?: number }) {\n  return <img src={HOTELX_PERSON_ICON} alt=\"\" aria-hidden=\"true\" width={size} height={size} style={{ width: size, height: size, display: 'inline-block', objectFit: 'contain', flex: '0 0 auto' }} />;\n}\n"
          addition = """

function AvailabilityIcon({ size = 23 }: { size?: number }) {
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
      style={{ display: 'block', fill: 'currentColor', flex: '0 0 auto' }}
    >
      <path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z" />
    </svg>
  );
}
"""
          if 'function AvailabilityIcon' not in text:
              if marker not in text:
                  raise SystemExit('PersonIcon marker not found')
              text = text.replace(marker, marker + addition, 1)

          old = '<button className="icon-button" aria-label="View availability" title="View availability" onClick={() => setAvailabilityOpen(true)}><CalendarDays size={23} /></button>'
          new = '<button className="icon-button" aria-label="View availability" title="View availability" onClick={() => setAvailabilityOpen(true)}><AvailabilityIcon size={23} /></button>'
          if old not in text:
              raise SystemExit('Availability toolbar button not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build:pages

      - name: Commit Availability icon change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/bookings.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use HotelX Availability icon path"
          git push origin main

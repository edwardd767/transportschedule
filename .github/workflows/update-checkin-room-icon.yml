name: Update Check In room icon

on:
  push:
    paths:
      - '.github/workflows/update-checkin-room-icon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Replace Check In room icon
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/check-in.tsx')
          text = path.read_text()

          text = text.replace('  BedDouble,\n', '')

          marker = "const ASSIGNMENT_KEY = '_roomAssignments';\n"
          block = """const ASSIGNMENT_KEY = '_roomAssignments';
const HOTELX_CHECKIN_ROOM_ICON = 'https://hms1.hotelx.asia/static/media/room.7cce94dd.svg';

function CheckInRoomIcon({ size = 13 }: { size?: number }) {
  return (
    <img
      src={HOTELX_CHECKIN_ROOM_ICON}
      alt=""
      aria-hidden="true"
      width={size}
      height={size}
      style={{ width: size, height: size, display: 'inline-block', objectFit: 'contain', flex: '0 0 auto' }}
    />
  );
}
"""
          if 'HOTELX_CHECKIN_ROOM_ICON' not in text:
              if marker not in text:
                  raise SystemExit('Assignment marker not found')
              text = text.replace(marker, block, 1)

          replacements = {
              '<BedDouble size={13} color="#214a9c" />': '<CheckInRoomIcon size={13} />',
              '<BedDouble size={12} color="#214a9c" />': '<CheckInRoomIcon size={12} />',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected icon markup not found: {old}')
              text = text.replace(old, new)

          path.write_text(text)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build:pages
      - name: Commit Check In room icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/check-in.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use HotelX room icon in Check In"
          git push origin main

name: Fix responsive Rate Element popup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-rate-element-modal-responsive.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Patch responsive popup styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('app/globals.css')
          s = p.read_text()
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          if old not in s:
              raise SystemExit('Rate element popup style block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: |
          npm run build:pages
          npm run test:transport
      - name: Commit responsive popup fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/globals.css
          git commit -m 'Make Rate Element popup responsive' || exit 0
          git push

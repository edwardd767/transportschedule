name: Fix Operational Policy Footer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-operational-policy-footer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Fix fixed Operational Policy footer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('components/hotel-settings-detail.tsx')
          s = component.read_text()
          old = '<div className="master-page-actions" style={{ justifyContent: \'center\' }}><button className="primary-button" type="button" onClick={async () => { await onProfileChange({ ...profile, operationalPolicy: draft }); }}>Save</button></div>'
          new = '<div className="master-page-actions operational-policy-actions"><button className="primary-button" type="button" onClick={async () => { await onProfileChange({ ...profile, operationalPolicy: draft }); }}>Save</button></div>'
          if old not in s:
              raise SystemExit('Operational Policy Save action row not found')
          component.write_text(s.replace(old, new, 1))

          css = Path('app/globals.css')
          c = css.read_text()
          marker = '/* Fixed Hotel Operational Policy footer */'
          block = '''\n/* Fixed Hotel Operational Policy footer */\n.operational-policy-page{padding-bottom:92px}\n.operational-policy-page>.operational-policy-actions{position:fixed;left:197px;right:0;bottom:0;height:74px;min-height:74px;margin:0;padding:10px 20px;background:#fff;box-shadow:0 -2px 7px #0002;z-index:20;display:flex;align-items:center;justify-content:center}\n.operational-policy-actions .primary-button{min-width:126px;height:40px;border-radius:4px;font-size:13px}\n@media(max-width:700px){.operational-policy-page{padding-bottom:84px}.operational-policy-page>.operational-policy-actions{left:0;height:68px;min-height:68px;padding:10px 12px}}\n'''
          if marker in c:
              start = c.index(marker)
              next_marker = c.find('\n/* ', start + len(marker))
              if next_marker == -1:
                  c = c[:start].rstrip() + block
              else:
                  c = c[:start] + block + c[next_marker:]
          else:
              c = c.rstrip() + block
          css.write_text(c)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: |
          npm run build:pages
          npm run test:transport
      - name: Commit fixed footer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/hotel-settings-detail.tsx app/globals.css
          git commit -m 'Fix Operational Policy footer bar' || exit 0
          git push

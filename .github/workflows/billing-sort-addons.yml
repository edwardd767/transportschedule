name: Billing sort includes add-ons

on:
  push:
    paths:
      - '.github/workflows/billing-sort-addons.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Include add-ons in per-date amount sorting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/billing-schedule.tsx')
          s = p.read_text()
          needle = "...(line.extraPax > 0 ? [{ key: 'extra-pax', name: 'Extra Pax', amount: line.extraPax }] : []),\n"
          insert = needle + "                    ...line.addOns.map((item, index) => ({ key: `addon-${index}`, name: `Add On - ${item.name}`, amount: item.amount })),\n"
          if needle not in s:
              raise SystemExit('Extra Pax breakdown line not found')
          s = s.replace(needle, insert, 1)
          old_labels = "{sortedBreakdown.map((item) => <small key={item.key}>{item.name}</small>)}{line.addOns.map((item, index) => <small key={`addon-${index}`}>Add On - {item.name}</small>)}"
          old_values = "{sortedBreakdown.map((item) => <small key={item.key}>{money(item.amount)}</small>)}{line.addOns.map((item, index) => <small key={`addon-${index}`}>{money(item.amount)}</small>)}"
          new_labels = "{sortedBreakdown.map((item) => <small key={item.key}>{item.name}</small>)}"
          new_values = "{sortedBreakdown.map((item) => <small key={item.key}>{money(item.amount)}</small>)}"
          if old_labels not in s or old_values not in s:
              raise SystemExit('Add-on render pattern not found')
          s = s.replace(old_labels, new_labels, 1).replace(old_values, new_values, 1)
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build:pages
      - name: Commit Billing Schedule add-on sort
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/billing-schedule.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Include add-ons in Billing Schedule amount sort"
          git push origin main

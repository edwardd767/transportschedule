name: Move booking occupancy to Room Type

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-booking-occupancy.yml'
      - 'scripts/move-occupancy-to-room-dialog.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply occupancy relocation
        run: python scripts/move-occupancy-to-room-dialog.py
      - name: Install dependencies
        run: npm ci
      - name: Verify transport rules and API
        run: npm run test:transport
      - name: Build GitHub Pages site
        run: npm run build:pages
      - name: Build standalone Cloudflare Worker
        run: npm run build:worker
      - name: Commit update
        run: |
          git config user.name "Edward Jacob"
          git config user.email "56201541+edwardd767@users.noreply.github.com"
          git add components/booking-create.tsx app/globals.css
          git commit -m "Move booking occupancy into Room Type selection"
          git push

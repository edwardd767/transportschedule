name: Update Room Management icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-room-management-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Patch Room Management icons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('components/housekeeping-bridge.tsx')
          s = p.read_text()

          replacements = [
              ("['🧹', 'Room Status']", "['https://hms1.hotelx.asia/static/media/roomstatus.76f49413.svg', 'Room Status']"),
              ("['🧾', 'Misc Charges']", "['https://hms1.hotelx.asia/static/media/misc.3e6de67d.svg', 'Misc Charges']"),
              ("['🚫', 'Block Room']", "['https://hms1.hotelx.asia/static/media/block.e3cb156a.svg', 'Block Room']"),
              ("['⚙️', 'Services']", "['https://hms1.hotelx.asia/static/media/services.875b8a9c.svg', 'Services']"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing Room Management icon source: {old}')
              s = s.replace(old, new)

          old_icon = '<span className="text-[20px] leading-none">{icon}</span>'
          new_icon = '<img src={icon} alt="" aria-hidden="true" className="h-[22px] w-[22px] object-contain" />'
          if old_icon not in s:
              raise SystemExit('Room Management icon renderer not found')
          s = s.replace(old_icon, new_icon)

          old_class = 'className="flex min-h-[58px] flex-col items-center justify-center gap-1 rounded-[5px] border border-[#ddd] bg-white text-[11px] font-semibold shadow-sm hover:bg-[#fff8ef]"'
          new_class = 'className="flex min-h-[58px] flex-col items-center justify-center gap-1 rounded-[5px] border border-[#ddd] bg-white text-[11px] font-bold shadow-sm hover:bg-[#fff8ef]"'
          if old_class not in s:
              raise SystemExit('Room Management button style not found')
          s = s.replace(old_class, new_class)

          old_label = '            {label}\n          </button>'
          new_label = '            <strong className="font-bold">{label}</strong>\n          </button>'
          if old_label not in s:
              raise SystemExit('Room Management label renderer not found')
          s = s.replace(old_label, new_label)

          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: |
          npm run build:pages
          npm run test:transport
      - name: Commit Room Management icon update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/housekeeping-bridge.tsx
          git commit -m 'Use HotelX Room Management icons' || exit 0
          git push

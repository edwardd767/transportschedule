name: Safe Operational Policy Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/safe-operational-policy-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply safe migration patch
        run: python scripts/tmp-keep-legacy-operational-policy.py
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: |
          npm run build:pages
          npm run test:transport
          npm run build:worker
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config worker/wrangler.jsonc
      - name: Commit safe normalized persistence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/normalized-storage.ts database/012_hotelx_operational_policy_columns.sql
          git rm scripts/tmp-keep-legacy-operational-policy.py
          git commit -m 'Use individual operational policy columns safely'
          git push

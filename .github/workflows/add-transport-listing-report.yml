name: Add Transport Listing report

on:
  push:
    paths:
      - '.github/workflows/add-transport-listing-report.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Wire Digital Reporting
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/report_patch.py
          python /tmp/report_patch.py
      - run: npm ci
      - name: Verify transport rules
        run: npm run test:transport
      - name: Verify Pages build
        run: npm run build:pages
      - name: Commit report integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css components/transport-listing-report.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add Transport Listing under Digital Reporting"
          git push origin main

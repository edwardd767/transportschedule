name: Add Transport Listing report

on:
  push:
    paths:
      - '.github/workflows/add-transport-listing-report.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Wire Digital Reporting
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('app/page.tsx')
          page = page_path.read_text()

          def replace_once(old, new, label):
              global page
              count = page.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              page = page.replace(old, new, 1)

          replace_once(
              "import { EditTransportTrip } from '@/components/edit-transport-trip';\n",
              "import { EditTransportTrip } from '@/components/edit-transport-trip';\nimport { TransportListingReport } from '@/components/transport-listing-report';\n",
              'report import',
          )
          replace_once(
              "    'schedule' | 'setup' | 'booking' | 'frontdesk'\n",
              "    'schedule' | 'setup' | 'booking' | 'frontdesk' | 'reporting'\n",
              'view union',
          )
          replace_once(
              '''            <button disabled title="Existing hotel module">\n              <ChartNoAxesCombined />\n              Digital Reporting\n            </button>''',
              '''            <button\n              className={view === 'reporting' ? 'active' : ''}\n              aria-current={view === 'reporting' ? 'page' : undefined}\n              onClick={() => setView('reporting')}\n            >\n              <ChartNoAxesCombined />\n              Digital Reporting\n            </button>''',
              'digital reporting nav',
          )
          replace_once(
              "            ) : view === 'frontdesk' ? (\n              <span>Front Desk</span>\n            ) : (\n",
              "            ) : view === 'frontdesk' ? (\n              <span>Front Desk</span>\n            ) : view === 'reporting' ? (\n              <>\n                Digital Reporting <ChevronRight size={14} /> Transport Listing\n              </>\n            ) : (\n",
              'breadcrumb',
          )
          replace_once(
              '''        ) : view === 'frontdesk' ? (\n          <div className="frontdesk-scroll" key="frontdesk">''',
              '''        ) : view === 'reporting' ? (\n          <TransportListingReport\n            trips={trips}\n            setup={setup}\n            bookingLegs={bookingLegs}\n          />\n        ) : view === 'frontdesk' ? (\n          <div className="frontdesk-scroll" key="frontdesk">''',
              'report view',
          )
          page_path.write_text(page)

          css_path = Path('app/globals.css')
          css = css_path.read_text()
          marker = '/* Transport Listing digital report */'
          if marker not in css:
              css += r'''

/* Transport Listing digital report */
.transport-report {
  display: flex;
  flex: 1;
  min-height: 0;
  flex-direction: column;
}
.transport-report-title {
  flex-shrink: 0;
}
.transport-report-title > div:first-child {
  min-width: 0;
}
.transport-report-title svg {
  color: #df880e;
}
.transport-report-actions {
  display: flex !important;
  gap: 8px !important;
  margin-left: auto;
}
.transport-report-summary {
  flex-shrink: 0;
  margin: 12px 0 8px;
}
.transport-report-summary strong {
  display: block;
  margin-top: 1px;
}
.transport-report-filters {
  display: grid;
  grid-template-columns: minmax(235px, 1.5fr) repeat(2, minmax(145px, 0.8fr)) repeat(4, minmax(145px, 0.9fr)) auto;
  gap: 8px;
  align-items: end;
  flex-shrink: 0;
  margin-bottom: 8px;
  padding: 10px 12px;
  border: 1px solid #e8e8eb;
  border-radius: 8px;
  background: #fff;
}
.transport-report-search {
  min-height: 38px;
  margin: 0;
}
.transport-report-date {
  display: flex;
  min-height: 38px;
  align-items: center;
  gap: 7px;
  padding: 0 9px;
  border: 1px solid #dedee2;
  border-radius: 6px;
  color: #66666d;
  background: #fff;
  font-size: 12px;
  white-space: nowrap;
}
.transport-report-date input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: #303036;
  font-size: 13px;
}
.transport-report-table-wrap {
  flex: 1;
  min-height: 0;
  overflow: auto;
  border: 1px solid #e8e8eb;
  border-radius: 8px;
  background: #fff;
  scrollbar-gutter: stable;
}
.transport-report-table {
  min-width: 1540px;
}
.transport-report-table th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: #f7f7f8;
  color: #55555c;
  font-size: 12px;
  font-weight: 700;
}
.transport-report-table td {
  font-size: 12px;
}
.transport-report-service,
.transport-report-route {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.transport-report-service {
  position: relative;
  padding-left: 20px;
}
.transport-report-service > svg {
  position: absolute;
  top: 1px;
  left: 0;
  color: #df880e;
}
.transport-report-service small,
.transport-report-route small {
  color: #777780;
  font-size: 11px;
}
.transport-report-route strong {
  font-weight: 600;
}
.transport-report-empty {
  min-height: 260px;
}

@media (max-width: 1400px) {
  .transport-report-filters {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .transport-report-search {
    grid-column: span 2;
  }
}
@media (max-width: 900px) {
  .transport-report-title {
    align-items: flex-start;
    flex-direction: column;
  }
  .transport-report-actions {
    width: 100%;
    margin-left: 0;
  }
  .transport-report-actions button {
    flex: 1;
  }
  .transport-report-filters {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .transport-report-search {
    grid-column: 1 / -1;
  }
  .transport-report-summary {
    grid-template-columns: repeat(2, 1fr);
    row-gap: 12px;
  }
  .transport-report-summary > div:nth-child(2) {
    border-right: 0;
  }
}
@media print {
  .topbar,
  .hotel-sidebar[data-slot='sidebar-container'],
  .property-banner,
  .transport-report-actions,
  .transport-report-filters {
    display: none !important;
  }
  .hotel-shell,
  .workspace,
  .transport-report,
  .transport-report-table-wrap {
    height: auto !important;
    min-height: 0 !important;
    overflow: visible !important;
  }
  .hotel-shell {
    padding-top: 0 !important;
  }
  .workspace {
    padding: 0 !important;
  }
  .transport-report-table-wrap {
    border: 0 !important;
  }
  .transport-report-table {
    min-width: 0 !important;
  }
  .transport-report-table th,
  .transport-report-table td {
    padding: 4px !important;
    font-size: 8px !important;
  }
  .transport-report-table th {
    position: static !important;
  }
}
'''
              css_path.write_text(css)
          PY
      - run: npm ci
      - name: Verify transport rules
        run: npm run test:transport
      - name: Verify Pages build
        run: npm run build:pages
      - name: Commit report integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css components/transport-listing-report.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add Transport Listing under Digital Reporting"
          git push origin main

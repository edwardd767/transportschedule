name: Billing breakdown per-date sort

on:
  push:
    paths:
      - '.github/workflows/billing-breakdown-sort.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Add per-date ASC DESC sorting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/billing-schedule.tsx')
          s = p.read_text()

          old_state = "  const [saving, setSaving] = useState(false);\n"
          new_state = "  const [saving, setSaving] = useState(false);\n  const [breakdownSort, setBreakdownSort] = useState<Record<string, 'asc' | 'desc'>>({});\n"
          if old_state not in s:
              raise SystemExit('Saving state pattern not found')
          s = s.replace(old_state, new_state, 1)

          old_toggle = "  function toggleLine(id: string) {\n    setSelected((current) => current.includes(id) ? current.filter((item) => item !== id) : [...current, id]);\n  }\n"
          new_toggle = "  function toggleLine(id: string) {\n    setSelected((current) => current.includes(id) ? current.filter((item) => item !== id) : [...current, id]);\n  }\n\n  function toggleBreakdownSort(id: string) {\n    setBreakdownSort((current) => ({\n      ...current,\n      [id]: current[id] === 'asc' ? 'desc' : 'asc',\n    }));\n  }\n"
          if old_toggle not in s:
              raise SystemExit('toggleLine pattern not found')
          s = s.replace(old_toggle, new_toggle, 1)

          old_render = '''                {dailyLines.map((line) => {\n                  const elementTotal = line.elements.reduce((sum, item) => sum + item.amount, 0);\n                  const addOnTotal = line.addOns.reduce((sum, item) => sum + item.amount, 0);\n                  const roomCharge = Math.max(0, line.amount - line.extraPax - elementTotal - addOnTotal);\n                  return <label className="billing-daily-line" key={line.id}><input type="checkbox" checked={selected.includes(line.id)} onChange={() => toggleLine(line.id)} /><span><strong>{dayLabel(line.date)} | {line.rateCode}</strong><span className="billing-breakdown-labels"><small>Room Charge</small>{line.elements.map((e,i) => <small key={`element-${i}`}>{e.name}</small>)}{line.extraPax > 0 && <small>Extra Pax</small>}{line.addOns.map((item, index) => <small key={`addon-${index}`}>Add On - {item.name}</small>)}</span></span><span><strong>{money(line.amount)}</strong><span className="billing-breakdown-values"><small>{money(roomCharge)}</small>{line.elements.map((e,i) => <small key={`element-${i}`}>{money(e.amount)}</small>)}{line.extraPax > 0 && <small>{money(line.extraPax)}</small>}{line.addOns.map((item, index) => <small key={`addon-${index}`}>{money(item.amount)}</small>)}</span></span></label>;\n                })}'''
          new_render = '''                {dailyLines.map((line) => {\n                  const elementTotal = line.elements.reduce((sum, item) => sum + item.amount, 0);\n                  const addOnTotal = line.addOns.reduce((sum, item) => sum + item.amount, 0);\n                  const roomCharge = Math.max(0, line.amount - line.extraPax - elementTotal - addOnTotal);\n                  const sortDirection = breakdownSort[line.id];\n                  const standardBreakdown = [\n                    { key: 'room-charge', name: 'Room Charge', amount: roomCharge },\n                    ...line.elements.map((item, index) => ({ key: `element-${index}`, name: item.name, amount: item.amount })),\n                    ...(line.extraPax > 0 ? [{ key: 'extra-pax', name: 'Extra Pax', amount: line.extraPax }] : []),\n                  ];\n                  const sortedBreakdown = sortDirection\n                    ? [...standardBreakdown].sort((a, b) => sortDirection === 'asc' ? a.amount - b.amount : b.amount - a.amount)\n                    : standardBreakdown;\n                  return <label className="billing-daily-line" key={line.id}><input type="checkbox" checked={selected.includes(line.id)} onChange={() => toggleLine(line.id)} /><span><strong>{dayLabel(line.date)} | <button type="button" title="Sort breakdown by amount" aria-label={`Sort ${line.date} ${line.rateCode} breakdown by amount ${sortDirection === 'asc' ? 'descending' : 'ascending'}`} onClick={(event) => { event.preventDefault(); event.stopPropagation(); toggleBreakdownSort(line.id); }} style={{ border: 0, padding: 0, background: 'transparent', font: 'inherit', fontWeight: 'inherit', cursor: 'pointer', color: 'inherit' }}>{line.rateCode}{sortDirection ? ` ${sortDirection === 'asc' ? '↑' : '↓'}` : ''}</button></strong><span className="billing-breakdown-labels">{sortedBreakdown.map((item) => <small key={item.key}>{item.name}</small>)}{line.addOns.map((item, index) => <small key={`addon-${index}`}>Add On - {item.name}</small>)}</span></span><span><strong>{money(line.amount)}</strong><span className="billing-breakdown-values">{sortedBreakdown.map((item) => <small key={item.key}>{money(item.amount)}</small>)}{line.addOns.map((item, index) => <small key={`addon-${index}`}>{money(item.amount)}</small>)}</span></span></label>;\n                })}'''
          if old_render not in s:
              raise SystemExit('Billing daily line render pattern not found')
          s = s.replace(old_render, new_render, 1)
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build:pages
      - name: Commit Billing Schedule sort
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/billing-schedule.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add per-date Billing Schedule amount sort"
          git push origin main

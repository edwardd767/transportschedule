name: Calendar size and alignment fix

on:
  push:
    paths:
      - '.github/workflows/calendar-size-alignment-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Compact calendar and fix Day List date alignment
        env:
          CALENDAR_CSS_B64: 
        run: python -c "import os,base64; from pathlib import Path; p=Path('app/globals.css'); s=p.read_text(); m='/* Unified HotelX calendar picker */'; assert m in s; css=base64.b64decode(os.environ['CALENDAR_CSS_B64']).decode(); p.write_text(s.split(m,1)[0].rstrip()+'\n\n'+css+'\n')"
      - run: npm ci
      - name: Verify transport tests
        run: npm run test:transport
      - name: Verify Pages build
        run: npm run build:pages
      - name: Verify Worker build
        run: npm run build:worker
      - name: Commit calendar UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m "Compact calendar and align Day List date filter"
          git push origin main

name: Calendar size and alignment fix

on:
  push:
    paths:
      - '.github/workflows/calendar-size-alignment-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Compact calendar and fix Day List date alignment
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/globals.css')
          s = p.read_text()
          marker = '/* Unified HotelX calendar picker */'
          if marker not in s:
              raise SystemExit('Unified calendar CSS marker not found')
          head = s.split(marker, 1)[0].rstrip()
          css = r'''
/* Unified HotelX calendar picker */
.hotel-date-field {
  width: 100%;
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  color: #292929;
  text-align: left;
  font-weight: 400;
  line-height: 1;
  white-space: nowrap;
}
.hotel-date-field:hover {
  border-color: #d6a15d;
  background: #fffaf3;
}
.hotel-date-field > span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hotel-date-field > svg {
  flex: 0 0 auto;
  color: #5f6670;
}
.hotel-month-field {
  min-width: 172px;
}

.hotel-calendar-dialog {
  width: min(360px, calc(100vw - 24px)) !important;
  max-width: 360px !important;
  padding: 0 !important;
  gap: 0 !important;
  overflow: hidden;
  border-radius: 8px !important;
  background: #fff;
  box-shadow: 0 14px 44px #00000038;
}
.hotel-calendar-header {
  min-height: 104px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 15px 24px 16px;
  background: var(--orange);
  color: #fff;
}
.hotel-calendar-header small {
  margin-bottom: 5px;
  color: #ffe0b0;
  font-size: 16px;
  line-height: 1.2;
  font-weight: 400;
}
.hotel-calendar-header strong {
  font-size: 30px;
  line-height: 1.08;
  font-weight: 400;
  letter-spacing: 0;
}
.hotel-calendar-monthbar {
  min-height: 54px;
  display: grid;
  grid-template-columns: 40px 1fr 40px;
  align-items: center;
  padding: 3px 12px;
}
.hotel-calendar-monthbar > strong {
  text-align: center;
  font-size: 18px;
  line-height: 1.2;
  font-weight: 400;
}
.hotel-calendar-nav {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #767676;
}
.hotel-calendar-nav:hover {
  background: #f3f3f3;
}
.hotel-calendar-nav svg {
  width: 20px;
  height: 20px;
}
.hotel-calendar-weekdays,
.hotel-calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  align-items: center;
  padding: 0 14px;
}
.hotel-calendar-weekdays {
  min-height: 34px;
  color: #999;
  font-size: 12px;
  text-align: center;
}
.hotel-calendar-grid {
  grid-auto-rows: 38px;
  min-height: 228px;
  align-content: start;
  padding-bottom: 5px;
}
.hotel-calendar-grid > span,
.hotel-calendar-grid > button {
  justify-self: center;
}
.hotel-calendar-grid > button {
  width: 33px;
  height: 33px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #292929;
  font-size: 14px;
  line-height: 33px;
  font-weight: 400;
  padding: 0;
}
.hotel-calendar-grid > button:hover:not(:disabled) {
  background: #fff1dc;
}
.hotel-calendar-grid > button.selected {
  background: var(--orange);
  color: #fff;
}
.hotel-calendar-grid > button:disabled {
  color: #c7c7c7;
  cursor: default;
}
.hotel-calendar-actions {
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 24px;
  padding: 5px 24px 11px;
}
.hotel-calendar-actions button {
  border: 0;
  background: transparent;
  color: var(--orange);
  font-size: 14px;
  line-height: 32px;
  font-weight: 600;
  padding: 0 3px;
}

/* Keep the Day List date navigation compact and aligned with all filters. */
.date-picker {
  display: grid !important;
  grid-template-columns: 34px minmax(150px, 1fr) 34px !important;
  align-items: center !important;
  gap: 0 !important;
  width: 292px !important;
  min-width: 292px !important;
  height: 40px !important;
  min-height: 40px !important;
  padding: 0 3px !important;
  border: 1px solid #dedee2 !important;
  border-radius: 7px !important;
  background: #fff !important;
  overflow: hidden;
}
.date-picker > button:not(.hotel-date-field) {
  width: 32px !important;
  min-width: 32px !important;
  height: 36px !important;
  min-height: 36px !important;
  display: grid !important;
  place-items: center !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 5px !important;
  background: transparent !important;
  color: #70747b !important;
}
.date-picker > button:not(.hotel-date-field):hover {
  background: #f5f5f6 !important;
}
.date-picker > .hotel-date-field {
  min-width: 0 !important;
  width: 100% !important;
  height: 36px !important;
  min-height: 36px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 7px !important;
  padding: 0 8px !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  color: #3d4147 !important;
  font-size: 14px !important;
  line-height: 36px !important;
  overflow: hidden;
}
.date-picker > .hotel-date-field:hover {
  background: #fffaf3 !important;
}
.date-picker > .hotel-date-field > span {
  flex: 0 1 auto;
  line-height: 1 !important;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.date-picker > .hotel-date-field > svg {
  width: 17px !important;
  height: 17px !important;
  flex: 0 0 17px !important;
  margin: 0 !important;
}

.transport-report-date .hotel-date-field {
  min-width: 132px;
}

@media (max-width: 720px) {
  .hotel-calendar-dialog {
    width: min(340px, calc(100vw - 20px)) !important;
    max-width: 340px !important;
  }
  .hotel-calendar-header {
    min-height: 94px;
    padding: 13px 20px 14px;
  }
  .hotel-calendar-header small {
    font-size: 14px;
  }
  .hotel-calendar-header strong {
    font-size: 26px;
  }
  .hotel-calendar-monthbar {
    min-height: 50px;
  }
  .hotel-calendar-monthbar > strong {
    font-size: 17px;
  }
  .hotel-calendar-weekdays,
  .hotel-calendar-grid {
    padding-inline: 10px;
  }
  .hotel-calendar-grid {
    grid-auto-rows: 36px;
    min-height: 216px;
  }
  .hotel-calendar-grid > button {
    width: 31px;
    height: 31px;
    line-height: 31px;
    font-size: 13px;
  }
  .hotel-calendar-actions {
    min-height: 48px;
    padding: 4px 20px 9px;
  }
  .date-picker {
    width: 260px !important;
    min-width: 260px !important;
    grid-template-columns: 32px minmax(130px, 1fr) 32px !important;
  }
}
'''.strip()
          p.write_text(head + '\n\n' + marker + '\n' + css.split(marker + '\n', 1)[-1] + '\n')
          PY
      - run: npm ci
      - name: Verify transport tests
        run: npm run test:transport
      - name: Verify Pages build
        run: npm run build:pages
      - name: Verify Worker build
        run: npm run build:worker
      - name: Commit calendar UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m "Compact calendar and align Day List date filter"
          git push origin main

name: Calendar size and alignment fix

on:
  push:
    paths:
      - '.github/workflows/calendar-size-alignment-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply compact calendar overrides
        run: |
          cat >> app/globals.css <<'CSS'

          /* Compact HotelX calendar sizing and Day List alignment */
          .hotel-calendar-dialog {
            width: min(360px, calc(100vw - 24px)) !important;
            max-width: 360px !important;
            border-radius: 8px !important;
            box-shadow: 0 14px 44px #00000038 !important;
          }
          .hotel-calendar-header {
            min-height: 104px !important;
            padding: 15px 24px 16px !important;
          }
          .hotel-calendar-header small {
            margin-bottom: 5px !important;
            font-size: 16px !important;
            line-height: 1.2 !important;
          }
          .hotel-calendar-header strong {
            font-size: 30px !important;
            line-height: 1.08 !important;
            letter-spacing: 0 !important;
          }
          .hotel-calendar-monthbar {
            min-height: 54px !important;
            grid-template-columns: 40px 1fr 40px !important;
            padding: 3px 12px !important;
          }
          .hotel-calendar-monthbar > strong {
            font-size: 18px !important;
            line-height: 1.2 !important;
          }
          .hotel-calendar-nav {
            width: 34px !important;
            height: 34px !important;
          }
          .hotel-calendar-nav svg {
            width: 20px !important;
            height: 20px !important;
          }
          .hotel-calendar-weekdays,
          .hotel-calendar-grid {
            padding-left: 14px !important;
            padding-right: 14px !important;
          }
          .hotel-calendar-weekdays {
            min-height: 34px !important;
            font-size: 12px !important;
          }
          .hotel-calendar-grid {
            grid-auto-rows: 38px !important;
            min-height: 228px !important;
            padding-bottom: 5px !important;
          }
          .hotel-calendar-grid > button {
            width: 33px !important;
            height: 33px !important;
            padding: 0 !important;
            font-size: 14px !important;
            line-height: 33px !important;
          }
          .hotel-calendar-actions {
            min-height: 52px !important;
            gap: 24px !important;
            padding: 5px 24px 11px !important;
          }
          .hotel-calendar-actions button {
            padding: 0 3px !important;
            font-size: 14px !important;
            line-height: 32px !important;
          }

          .hotel-date-field {
            gap: 8px !important;
            padding: 6px 10px !important;
            line-height: 1 !important;
            white-space: nowrap !important;
          }
          .hotel-date-field > span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
          .hotel-date-field > svg {
            flex: 0 0 auto;
          }
          .hotel-month-field {
            min-width: 172px !important;
          }

          .date-picker {
            display: grid !important;
            grid-template-columns: 34px minmax(150px, 1fr) 34px !important;
            align-items: center !important;
            gap: 0 !important;
            width: 292px !important;
            min-width: 292px !important;
            height: 40px !important;
            min-height: 40px !important;
            padding: 0 3px !important;
            border: 1px solid #dedee2 !important;
            border-radius: 7px !important;
            background: #fff !important;
            overflow: hidden !important;
          }
          .date-picker > button:not(.hotel-date-field) {
            width: 32px !important;
            min-width: 32px !important;
            height: 36px !important;
            min-height: 36px !important;
            display: grid !important;
            place-items: center !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 5px !important;
            background: transparent !important;
            color: #70747b !important;
          }
          .date-picker > button:not(.hotel-date-field):hover {
            background: #f5f5f6 !important;
          }
          .date-picker > .hotel-date-field {
            min-width: 0 !important;
            width: 100% !important;
            height: 36px !important;
            min-height: 36px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 7px !important;
            padding: 0 8px !important;
            border: 0 !important;
            border-radius: 0 !important;
            background: transparent !important;
            color: #3d4147 !important;
            font-size: 14px !important;
            line-height: 36px !important;
            overflow: hidden !important;
          }
          .date-picker > .hotel-date-field:hover {
            background: #fffaf3 !important;
          }
          .date-picker > .hotel-date-field > span {
            flex: 0 1 auto !important;
            line-height: 1 !important;
          }
          .date-picker > .hotel-date-field > svg {
            width: 17px !important;
            height: 17px !important;
            flex: 0 0 17px !important;
            margin: 0 !important;
          }
          .transport-report-date .hotel-date-field {
            min-width: 132px !important;
          }

          @media (max-width: 720px) {
            .hotel-calendar-dialog {
              width: min(340px, calc(100vw - 20px)) !important;
              max-width: 340px !important;
            }
            .hotel-calendar-header {
              min-height: 94px !important;
              padding: 13px 20px 14px !important;
            }
            .hotel-calendar-header small {
              font-size: 14px !important;
            }
            .hotel-calendar-header strong {
              font-size: 26px !important;
            }
            .hotel-calendar-monthbar {
              min-height: 50px !important;
            }
            .hotel-calendar-monthbar > strong {
              font-size: 17px !important;
            }
            .hotel-calendar-weekdays,
            .hotel-calendar-grid {
              padding-left: 10px !important;
              padding-right: 10px !important;
            }
            .hotel-calendar-grid {
              grid-auto-rows: 36px !important;
              min-height: 216px !important;
            }
            .hotel-calendar-grid > button {
              width: 31px !important;
              height: 31px !important;
              font-size: 13px !important;
              line-height: 31px !important;
            }
            .hotel-calendar-actions {
              min-height: 48px !important;
              padding: 4px 20px 9px !important;
            }
            .date-picker {
              width: 260px !important;
              min-width: 260px !important;
              grid-template-columns: 32px minmax(130px, 1fr) 32px !important;
            }
          }
          CSS
      - run: npm ci
      - name: Verify transport tests
        run: npm run test:transport
      - name: Verify Pages build
        run: npm run build:pages
      - name: Verify Worker build
        run: npm run build:worker
      - name: Commit calendar UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m "Compact calendar and align Day List date filter"
          git push origin main

name: Remove Transport Calendar daily events

on:
  push:
    paths:
      - '.github/workflows/remove-calendar-events.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Remove daily event portion
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('components/month-timetable.tsx')
          s = p.read_text()

          old = """  const monthEvents = dates.flatMap((date) =>\n    date && notes[date]?.holiday ? [{ date, name: notes[date].holiday }] : [],\n  );\n"""
          if old not in s:
              raise SystemExit('monthEvents block not found')
          s = s.replace(old, '', 1)

          start = """      {monthEvents.length > 0 && (\n        <div\n          className=\"timetable-events\"\n          aria-label=\"Public holidays and events this month\"\n        >\n          <strong>Holidays &amp; events</strong>\n          {monthEvents.map((event) => (\n            <button\n              key={event.date}\n              type=\"button\"\n              onClick={() => onDay(event.date)}\n            >\n              <b>{Number(event.date.slice(-2))}</b>\n              <span>{event.name}</span>\n            </button>\n          ))}\n        </div>\n      )}\n"""
          if start not in s:
              raise SystemExit('monthly event strip not found')
          s = s.replace(start, '', 1)

          s = s.replace(
              "className={`timetable-day ${index % 7 >= 5 ? 'is-weekend' : ''} ${note.holiday ? 'has-event' : ''}`}",
              "className={`timetable-day ${index % 7 >= 5 ? 'is-weekend' : ''}`}",
              1,
          )
          s = s.replace(
              "title={note.holiday || note.notes || 'Daily notes'}",
              "title={note.notes || note.tide || note.restricted || 'Daily notes'}",
              1,
          )

          event_block = """                {note.holiday && (\n                  <button\n                    type=\"button\"\n                    className=\"compact-event\"\n                    title={note.holiday}\n                    aria-label={`${note.holiday} on ${formatDate(date)}. Open day listing.`}\n                    onClick={() => onDay(date)}\n                  >\n                    <span>Event</span>\n                    <strong>{note.holiday}</strong>\n                  </button>\n                )}\n"""
          if event_block not in s:
              raise SystemExit('daily compact event block not found')
          s = s.replace(event_block, '', 1)

          s = s.replace(
              "                  ['holiday', 'Holiday / event'],\n",
              '',
              1,
          )

          p.write_text(s)

          r = Path('README.md')
          readme = r.read_text()
          readme = readme.replace(
              'Holiday markers and the daily-note editor remain available in the compact view.',
              'The daily-note editor remains available for tide windows, restricted windows and operating notes in the compact view.',
          )
          r.write_text(readme)
          PY
      - run: npm ci
      - name: Verify transport rules
        run: npm run test:transport
      - name: Verify Pages build
        run: npm run build:pages
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/month-timetable.tsx README.md
          git diff --cached --quiet && exit 0
          git commit -m "Remove daily events from Transport Calendar"
          git push origin main

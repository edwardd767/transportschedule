name: Normalize transport storage

on:
  push:
    paths:
      - '.github/workflows/normalized-storage-migration.yml'

permissions:
  contents: write

jobs:
  migrate-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply normalized storage patch
        run: python .github/scripts/normalized_storage_patch.py
      - run: npm ci
      - name: Verify transport tests
        run: npm run test:transport
      - name: Verify Pages build
        run: npm run build:pages
      - name: Verify Worker build
        run: npm run build:worker
      - name: Commit normalized storage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.ts scripts/test-transport-worker.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Use normalized PostgreSQL transport tables"
          git push origin main

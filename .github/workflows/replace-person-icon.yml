name: Replace Booking guest icon

on:
  push:
    paths:
      - '.github/workflows/replace-person-icon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Replace guest icons with HotelX person SVG
        run: |
          python - <<'PY'
          from pathlib import Path

          person_url = "https://hms1.hotelx.asia/static/media/person.eed5ce8b.svg"

          p = Path('components/bookings.tsx')
          s = p.read_text()
          s = s.replace('  UserRound,\n', '')
          if 'HOTELX_PERSON_ICON' not in s:
              marker = "function RoomIcon({ size = 18 }: { size?: number }) {\n  return <img src={HOTELX_ROOM_ICON} alt=\"\" aria-hidden=\"true\" width={size} height={size} style={{ width: size, height: size, display: 'inline-block', objectFit: 'contain', flex: '0 0 auto' }} />;\n}\n\n"
              block = marker + f"const HOTELX_PERSON_ICON = '{person_url}';\n\nfunction PersonIcon({{ size = 18 }}: {{ size?: number }}) {{\n  return <img src={{HOTELX_PERSON_ICON}} alt=\"\" aria-hidden=\"true\" width={{size}} height={{size}} style={{{{ width: size, height: size, display: 'inline-block', objectFit: 'contain', flex: '0 0 auto' }}}} />;\n}}\n\n"
              if marker not in s:
                  raise SystemExit('Bookings RoomIcon marker not found')
              s = s.replace(marker, block, 1)
          old = '<UserRound size={18} aria-hidden="true" />'
          if old not in s:
              raise SystemExit('Bookings guest icon not found')
          s = s.replace(old, '<PersonIcon size={18} />', 1)
          p.write_text(s)

          p = Path('components/billing-schedule.tsx')
          s = p.read_text()
          s = s.replace(', DoorClosed, UserRound', ', DoorClosed')
          s = s.replace(', UserRound }', ' }')
          if 'HOTELX_PERSON_ICON' not in s:
              marker = "function RoomIcon({ size = 14 }: { size?: number }) {\n  return <img src={HOTELX_ROOM_ICON} alt=\"\" aria-hidden=\"true\" width={size} height={size} style={{ width: size, height: size, display: 'inline-block', objectFit: 'contain', flex: '0 0 auto' }} />;\n}\n\n"
              block = marker + f"const HOTELX_PERSON_ICON = '{person_url}';\n\nfunction PersonIcon({{ size = 14 }}: {{ size?: number }}) {{\n  return <img src={{HOTELX_PERSON_ICON}} alt=\"\" aria-hidden=\"true\" width={{size}} height={{size}} style={{{{ width: size, height: size, display: 'inline-block', objectFit: 'contain', flex: '0 0 auto' }}}} />;\n}}\n\n"
              if marker not in s:
                  raise SystemExit('Billing RoomIcon marker not found')
              s = s.replace(marker, block, 1)
          old = '<UserRound size={14} />'
          if old not in s:
              raise SystemExit('Billing guest icon not found')
          s = s.replace(old, '<PersonIcon size={14} />', 1)
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build:pages
      - name: Commit person icon update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/bookings.tsx components/billing-schedule.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use HotelX person icon for guest counts"
          git push origin main

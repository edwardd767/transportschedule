name: Persist Department toggle flags

on:
  push:
    paths:
      - '.github/workflows/persist-department-toggle-flags.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Apply Department flag persistence patch
        run: python scripts/persist-department-flags.py

      - name: Verify build and tests
        run: |
          npm ci
          npm run build:pages
          npm run test:transport
          npm run build:worker

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config worker/wrangler.jsonc

      - name: Commit Department flag persistence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/normalized-storage.ts database/011_hotelx_department_access_flags.sql
          git diff --cached --quiet && exit 0
          git commit -m "Persist Department access toggles in database"
          git push origin main

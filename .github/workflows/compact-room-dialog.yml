name: Compact room dialog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-room-dialog.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply compact Room Type dialog
        run: python scripts/apply-room-dialog-compact.py

      - name: Install dependencies
        run: npm ci

      - name: Verify transport rules and API
        run: npm run test:transport

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Build standalone Cloudflare Worker
        run: npm run build:worker

      - name: Commit update
        shell: bash
        run: |
          rm .github/workflows/compact-room-dialog.yml scripts/apply-room-dialog-compact.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/globals.css .github/workflows/compact-room-dialog.yml scripts/apply-room-dialog-compact.py
          git commit -m 'Compact Room Type dialog for 100 percent zoom'
          git push origin HEAD:main

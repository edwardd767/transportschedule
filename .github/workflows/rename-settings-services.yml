name: Rename transport settings terminology

on:
  push:
    paths:
      - '.github/workflows/rename-settings-services.yml'

permissions:
  contents: write

jobs:
  rename-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Finish service terminology in Settings UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/transport-setup.tsx')
          text = path.read_text()

          replacements = [
              ('<Ship size={14} /> Speedboat', '<Ship size={14} /> Transport'),
              ('aria-label={`Edit boat ${b.name}`}', 'aria-label={`Edit service ${b.name}`}'),
              ('Turnaround time reserves\n                the boat after its journey.', 'Turnaround time reserves\n                the service after its journey.'),
              ('Tide and weather notes guide staff; the prototype does not\n                calculate tide availability.', 'Weather and operating notes guide staff; the prototype does not\n                calculate external service availability.'),
              ('placeholder="e.g. Rawa 04"', 'placeholder="e.g. Island Transfer 01"'),
              ('onNotice(`${editor.kind[0].toUpperCase() + editor.kind.slice(1)} saved.`);', "onNotice(`${editor.kind === 'boat' ? 'Service' : editor.kind[0].toUpperCase() + editor.kind.slice(1)} saved.`);"),
          ]

          missing = [old for old, _ in replacements if old not in text]
          if missing:
              raise SystemExit('Expected text not found: ' + repr(missing))

          for old, new in replacements:
              text = text.replace(old, new)

          path.write_text(text)
          PY
      - name: Commit terminology cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/transport-setup.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Finish services terminology in transport settings"
          git push origin main

name: Fix Standard Policy Back Navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-standard-policy-back.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply navigation fix
        run: python scripts/tmp-fix-standard-policy-back.py
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: |
          npm run build:pages
          npm run test:transport
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx components/hotel-settings-detail.tsx
          git rm scripts/tmp-fix-standard-policy-back.py
          git commit -m 'Fix Standard Policy back navigation hierarchy'
          git push

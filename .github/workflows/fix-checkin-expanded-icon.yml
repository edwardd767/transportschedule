name: Fix Check In expanded icon

on:
  push:
    paths:
      - '.github/workflows/fix-checkin-expanded-icon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Replace expanded icon only
        run: |
          python -c "from pathlib import Path; p=Path('components/check-in.tsx'); t=p.read_text(); old='<CheckInRoomIcon size={12} />'; new='<img src=\"https://hms1.hotelx.asia/static/media/checkin-frontdesk.e607e9bc.svg\" alt=\"\" aria-hidden=\"true\" width={12} height={12} style={{ width: 12, height: 12, display: \'inline-block\', objectFit: \'contain\', flex: \'0 0 auto\' }} />'; assert old in t, 'expanded icon marker not found'; p.write_text(t.replace(old,new,1))"
      - name: Verify build
        run: |
          npm ci
          npm run build:pages
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/check-in.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix expanded Check In icon"
          git push origin main

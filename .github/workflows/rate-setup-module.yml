name: Rate Setup module

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rate-setup-module.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Rate Setup module
        run: python scripts/apply-rate-setup-module.py

      - name: Install dependencies
        run: npm ci

      - name: Verify transport rules and API
        run: npm run test:transport

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Build standalone Cloudflare Worker
        run: npm run build:worker

      - name: Commit update
        shell: bash
        run: |
          rm .github/workflows/rate-setup-module.yml scripts/apply-rate-setup-module.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/globals.css components/hotel-settings-menu.tsx components/hotel-settings-detail.tsx components/rate-setup.tsx .github/workflows/rate-setup-module.yml scripts/apply-rate-setup-module.py
          git commit -m 'Implement HotelX Rate Setup screens'
          git push origin HEAD:main

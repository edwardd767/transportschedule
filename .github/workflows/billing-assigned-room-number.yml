name: Show assigned room number in Billing Schedule

on:
  push:
    paths:
      - '.github/workflows/billing-assigned-room-number.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Update Billing Schedule room display
        run: |
          echo '' | base64 -d | python

      - name: Verify build
        run: |
          npm ci
          npm run build:pages

      - name: Commit Billing Schedule room number
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/billing-schedule.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Show assigned room number in Billing Schedule"
          git push origin main

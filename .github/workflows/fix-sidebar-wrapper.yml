name: Fix sidebar wrapper breakpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sidebar-wrapper.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply sidebar wrapper breakpoint fix
        run: python scripts/fix-sidebar-wrapper-breakpoint.py

      - name: Install dependencies
        run: npm ci

      - name: Verify transport rules and API
        run: npm run test:transport

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Build standalone Cloudflare Worker
        run: npm run build:worker

      - name: Commit update
        shell: bash
        run: |
          rm .github/workflows/fix-sidebar-wrapper.yml scripts/fix-sidebar-wrapper-breakpoint.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/ui/sidebar.tsx .github/workflows/fix-sidebar-wrapper.yml scripts/fix-sidebar-wrapper-breakpoint.py
          git commit -m 'Fix HotelX desktop sidebar wrapper breakpoint'
          git push origin HEAD:main

name: Fix Room Management label size

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-room-management-label-size.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Fix Room Management label size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/housekeeping-bridge.tsx')
          s = p.read_text()
          old = '<strong className="font-bold">{label}</strong>'
          new = '<strong className="font-bold" style={{ fontSize: 10, lineHeight: \'11px\' }}>{label}</strong>'
          if old not in s:
              raise SystemExit('Room Management label element not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: |
          npm run build:pages
          npm run test:transport
      - name: Commit Room Management label size fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/housekeeping-bridge.tsx
          git commit -m 'Fix Room Management label font size' || exit 0
          git push

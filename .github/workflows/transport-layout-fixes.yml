name: Transport layout fixes

on:
  push:
    paths:
      - '.github/workflows/transport-layout-fixes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply requested layout fixes
        run: python .github/scripts/transport_layout_fixes.py
      - run: npm ci
      - name: Verify transport tests
        run: npm run test:transport
      - name: Verify production build
        run: npm run build:pages
      - name: Commit layout fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css components/booking-transfers.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Align transport filters icons and delete actions"
          git push origin main

name: Transport layout fixes

on:
  push:
    paths:
      - '.github/workflows/transport-layout-fixes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply requested layout fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          # 1. Move Status filter into the main Transport Listing filter row.
          p = Path('app/page.tsx')
          s = p.read_text()
          boat_block = """                    <Choice
                      label=\"Filter trips by boat\"
                      value={boatFilter}
                      onChange={setBoatFilter}
                      items={[
                        { value: 'all', label: 'All boats' },
                        ...setup.boats.map((boat) => ({
                          value: boat.id,
                          label: boat.name,
                        })),
                      ]}
                    />
"""
          status_block = """                    <Choice
                      value={statusFilter}
                      onChange={setStatusFilter}
                      label=\"Trip status\"
                      items={[
                        'all',
                        'Scheduled',
                        'Full',
                        'Cancelled',
                      ].map((s) => ({
                        value: s,
                        label: s === 'all' ? 'All statuses' : s,
                      }))}
                    />
"""
          s = replace_once(s, boat_block, boat_block + status_block, 'insert status filter')
          old_subhead = """                  <div className=\"list-subhead\">
                    <h2>{formatDate(date)}</h2>
                    <Choice
                      value={statusFilter}
                      onChange={setStatusFilter}
                      label=\"Trip status\"
                      items={[
                        'all',
                        'Scheduled',
                        'Full',
                        'Cancelled',
                      ].map((s) => ({
                        value: s,
                        label: s === 'all' ? 'All statuses' : s,
                      }))}
                    />
                  </div>
"""
          new_subhead = """                  <div className=\"list-subhead\">
                    <h2>{formatDate(date)}</h2>
                  </div>
"""
          s = replace_once(s, old_subhead, new_subhead, 'remove old status filter')
          p.write_text(s)

          # 2. Booking Transport: use a simple filled trash icon only, aligned right.
          p = Path('components/booking-transfers.tsx')
          s = p.read_text()
          s = replace_once(
              s,
              "import { CalendarDays, Car, MapPin, Plus, Ship, Trash2, Users } from 'lucide-react';",
              "import { CalendarDays, Car, MapPin, Plus, Ship, Users } from 'lucide-react';",
              'remove Trash2 import',
          )
          service_icon = """function ServiceIcon({ type }: { type: string }) {
  return type === 'Speedboat' ? <Ship size={17} /> : <Car size={17} />;
}
"""
          delete_icon = """function ServiceIcon({ type }: { type: string }) {
  return type === 'Speedboat' ? <Ship size={17} /> : <Car size={17} />;
}

function DeleteIcon({ size = 18 }: { size?: number }) {
  return (
    <svg
      width={size}
      height={size}
      viewBox=\"0 0 24 24\"
      aria-hidden=\"true\"
      focusable=\"false\"
    >
      <path
        fill=\"currentColor\"
        d=\"M9 3h6l1 2h4v2H4V5h4l1-2Zm-2 6h10l-.7 11.1A2 2 0 0 1 14.3 22h-4.6a2 2 0 0 1-2-1.9L7 9Z\"
      />
    </svg>
  );
}
"""
          s = replace_once(s, service_icon, delete_icon, 'add delete icon')
          old_button = """              <button
                type=\"button\"
                className=\"edit-button\"
                disabled={pending}
                onClick={async () => {
                  try {
                    await onRemove(leg.id);
                    setError('');
                  } catch (error) {
                    setError((error as Error).message);
                  }
                }}
              >
                <Trash2 size={15} /> Remove
              </button>
"""
          new_button = """              <button
                type=\"button\"
                className=\"transport-remove-button\"
                aria-label={`Remove ${leg.serviceName}`}
                title=\"Remove transport\"
                disabled={pending}
                onClick={async () => {
                  try {
                    await onRemove(leg.id);
                    setError('');
                  } catch (error) {
                    setError((error as Error).message);
                  }
                }}
              >
                <DeleteIcon size={18} />
              </button>
"""
          s = replace_once(s, old_button, new_button, 'replace remove button')
          p.write_text(s)

          # 3. Keep Services/Operators section icons inside the panel and align remove icons.
          p = Path('app/globals.css')
          s = p.read_text()
          label_css = """.settings-section-label span {
  margin-left: auto;
  font-size: 12px;
}
"""
          label_css_new = """.settings-section-label span {
  margin-left: auto;
  font-size: 12px;
}
.setup-panel > .settings-section-label {
  padding: 0 18px 2px;
}
"""
          s = replace_once(s, label_css, label_css_new, 'setup section icon alignment')
          transfer_css = """.transfer-options .transfer-option {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 8px;
  padding: 9px;
  margin-bottom: 6px;
  border: 1px solid #e1e5eb;
  background: #fff;
  border-radius: 5px;
  cursor: pointer;
}
"""
          transfer_css_new = """.transfer-options .transfer-option {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 8px;
  padding: 9px;
  margin-bottom: 6px;
  border: 1px solid #e1e5eb;
  background: #fff;
  border-radius: 5px;
  cursor: pointer;
}
.transfer-options .transfer-option > span {
  flex: 1;
  min-width: 0;
}
.transport-remove-button {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  min-width: 34px;
  margin-left: auto;
  padding: 0;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: #7c7f84;
  flex-shrink: 0;
}
.transport-remove-button:hover {
  background: #f4f4f5;
  color: #55585d;
}
.transport-remove-button:disabled {
  opacity: 0.45;
}
"""
          s = replace_once(s, transfer_css, transfer_css_new, 'transport delete alignment')
          p.write_text(s)

          # Guard the requested visible behavior.
          page = Path('app/page.tsx').read_text()
          booking = Path('components/booking-transfers.tsx').read_text()
          css = Path('app/globals.css').read_text()
          assert page.index('label=\"Trip status\"') < page.index('className=\"search-field\"')
          assert 'Trash2' not in booking
          assert '> Remove' not in booking
          assert 'transport-remove-button' in booking and 'DeleteIcon' in booking
          assert '.setup-panel > .settings-section-label' in css
          assert '.transport-remove-button' in css
          PY
      - run: npm ci
      - name: Verify transport tests
        run: npm run test:transport
      - name: Verify production build
        run: npm run build:pages
      - name: Commit layout fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css components/booking-transfers.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Align transport filters icons and delete actions"
          git push origin main

name: Normalize Operational Policy Columns

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-operational-policy.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply operational policy column migration
        run: python scripts/tmp-normalize-operational-policy.py
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: |
          npm run build:pages
          npm run test:transport
          npm run build:worker
      - name: Commit normalized persistence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/normalized-storage.ts database/012_hotelx_operational_policy_columns.sql
          git rm scripts/tmp-normalize-operational-policy.py
          git commit -m 'Store operational policy in individual columns'
          git push

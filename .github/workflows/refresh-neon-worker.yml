name: Refresh Neon Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-neon-worker.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tests
        run: npm run test:transport
      - name: Build Pages
        run: npm run build:pages
      - name: Refresh Worker bundle
        run: npm run build:worker
      - name: Verify Booking Edit and Neon direct endpoint support
        run: |
          grep -q 'bookingUpdate' worker/hotelx-transport-api.deploy.js
          grep -q 'nonPoolerHost' worker/hotelx-transport-api.deploy.js
      - name: Commit refreshed Worker bundle
        run: |
          git config user.name "Edward Jacob"
          git config user.email "56201541+edwardd767@users.noreply.github.com"
          git add worker/hotelx-transport-api.deploy.js
          if git diff --cached --quiet; then
            echo "Worker bundle already current"
          else
            git commit -m "Refresh Worker after Neon connection fix"
            git push
          fi

name: Refresh Neon Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-neon-worker.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Keep redirect failures strict
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/neon.ts')
          text = p.read_text()
          old = "!['DATABASE_CONNECTION', 'DATABASE_TIMEOUT', 'DATABASE_REDIRECT'].includes(error.code)"
          new = "!['DATABASE_CONNECTION', 'DATABASE_TIMEOUT'].includes(error.code)"
          if old not in text:
              raise SystemExit('Expected Neon fallback matcher not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify tests
        run: npm run test:transport
      - name: Build Pages
        run: npm run build:pages
      - name: Refresh Worker bundle
        run: npm run build:worker
      - name: Verify Booking Edit and Neon direct endpoint support
        run: |
          grep -q 'bookingUpdate' worker/hotelx-transport-api.deploy.js
          grep -q 'nonPoolerHost' worker/hotelx-transport-api.deploy.js
      - name: Commit Neon fix and refreshed Worker bundle
        run: |
          git config user.name "Edward Jacob"
          git config user.email "56201541+edwardd767@users.noreply.github.com"
          git add worker/neon.ts worker/hotelx-transport-api.deploy.js
          if git diff --cached --quiet; then
            echo "Worker bundle already current"
          else
            git commit -m "Fix Neon HTTP routing and refresh Worker"
            git push
          fi

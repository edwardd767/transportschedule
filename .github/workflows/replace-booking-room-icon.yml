name: Replace Booking room icon

on:
  push:
    paths:
      - '.github/workflows/replace-booking-room-icon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Replace Booking room icon
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/bookings.tsx')
          text = path.read_text()
          old = "const HOTELX_ROOM_ICON = 'https://hms1.hotelx.asia/static/media/door-subinfoline.44af6263.svg';"
          new = "const HOTELX_ROOM_ICON = 'https://hms1.hotelx.asia/static/media/room.7cce94dd.svg';"
          if old not in text:
              raise SystemExit('Current Booking room icon constant not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build:pages

      - name: Commit Booking room icon change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/bookings.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use HotelX room icon in Booking occupancy"
          git push origin main

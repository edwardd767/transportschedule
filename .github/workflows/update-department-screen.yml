name: Update Department screen

on:
  push:
    paths:
      - '.github/workflows/update-department-screen.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Apply Department screen patch
        run: |
          echo '' | base64 -d > /tmp/patch_department.py
          python /tmp/patch_department.py

      - name: Verify build
        run: |
          npm ci
          npm run build:pages

      - name: Commit Department screen changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/department-module-polished.tsx lib/hotel-masters.ts app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m "Match HotelX Department listing and add department creation"
          git push origin main

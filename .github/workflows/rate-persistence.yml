name: Rate Setup persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rate-persistence.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Rate Setup persistence
        run: python scripts/apply-rate-persistence.py

      - name: Install dependencies
        run: npm ci

      - name: Verify transport rules and API
        run: npm run test:transport

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Build standalone Cloudflare Worker
        run: npm run build:worker

      - name: Refresh Worker copy-paste bundle
        run: cp dist/worker/hotelx-transport-api.js worker/hotelx-transport-api.deploy.js

      - name: Commit update
        shell: bash
        run: |
          rm .github/workflows/rate-persistence.yml scripts/apply-rate-persistence.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx components/rate-setup.tsx components/hotel-settings-detail.tsx lib/transport-state.ts lib/rate-setup-data.ts worker/normalized-storage.ts worker/hotelx-transport-api.deploy.js .github/workflows/rate-persistence.yml scripts/apply-rate-persistence.py
          git commit -m 'Connect Rate Setup UI to Neon persistence'
          git push origin HEAD:main

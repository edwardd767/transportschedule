name: Edit Department popup

on:
  push:
    paths:
      - '.github/workflows/edit-department-popup.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Apply Edit Department patch
        run: |
          echo '' | base64 -d > /tmp/edit_department_patch.py
          python /tmp/edit_department_patch.py
      - name: Verify build
        run: |
          npm ci
          npm run build:pages
      - name: Commit Edit Department changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/department-module-polished.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add Edit Department popup"
          git push origin main

name: Remove extra trip statuses

on:
  push:
    paths:
      - '.github/workflows/remove-extra-trip-statuses.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Simplify trip statuses
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/page.tsx')
          s = p.read_text()

          old_change = """  async function changeStatus(value: string) {\n    if (!selected) return;\n    try {\n      // Boarding is no longer a user-facing workflow. Mark any legacy\n      // passenger flags internally before completing so the existing\n      // private API remains backward compatible.\n      if (value === 'Completed') {\n        for (const group of selected.groups.filter((g) => !g.boarded)) {\n          await store.run({\n            type: 'board',\n            tripId: selected.id,\n            groupId: group.id,\n            boarded: true,\n          });\n        }\n      }\n      await store.run({\n"""
          new_change = """  async function changeStatus(value: string) {\n    if (!selected) return;\n    try {\n      await store.run({\n"""
          if old_change not in s:
              raise SystemExit('changeStatus completion block not found')
          s = s.replace(old_change, new_change, 1)

          old_filter = """                      items={[\n                        'all',\n                        'Scheduled',\n                        'Full',\n                        'Delayed',\n                        'Cancelled',\n                        'Completed',\n                      ].map((s) => ({\n"""
          new_filter = """                      items={[\n                        'all',\n                        'Scheduled',\n                        'Full',\n                        'Cancelled',\n                      ].map((s) => ({\n"""
          if old_filter not in s:
              raise SystemExit('status filter options not found')
          s = s.replace(old_filter, new_filter, 1)

          old_status = """                    items={[\n                      'Scheduled',\n                      'Delayed',\n                      'Cancelled',\n                      'Completed',\n                    ].map((s) => ({ value: s, label: s }))}\n"""
          new_status = """                    items={['Scheduled', 'Cancelled'].map((s) => ({\n                      value: s,\n                      label: s,\n                    }))}\n"""
          if old_status not in s:
              raise SystemExit('trip status selector options not found')
          s = s.replace(old_status, new_status, 1)

          old_edit = """                  disabled={\n                    selected.status === 'Completed' ||\n                    selected.status === 'Cancelled'\n                  }\n"""
          new_edit = """                  disabled={selected.status === 'Cancelled'}\n"""
          if old_edit not in s:
              raise SystemExit('edit departure status restriction not found')
          s = s.replace(old_edit, new_edit, 1)

          old_closed = """                            const closed = ['Cancelled', 'Completed'].includes(\n                              t.status,\n                            );\n"""
          new_closed = """                            const closed = t.status === 'Cancelled';\n"""
          if old_closed not in s:
              raise SystemExit('trip closed calculation not found')
          s = s.replace(old_closed, new_closed, 1)

          s = s.replace(
              "                          ['Cancelled', 'Completed'].includes(selected.status)\n",
              "                          selected.status === 'Cancelled'\n",
              1,
          )

          if "'Delayed'," in s or "'Completed'," in s:
              raise SystemExit('Delayed/Completed options remain in page.tsx')
          p.write_text(s)

          p = Path('lib/transport-state.ts')
          s = p.read_text()
          old_normalize = """    trips: state.trips.map((trip) =>\n      trip.status === 'Boarding' ? { ...trip, status: 'Scheduled' } : trip,\n    ),\n"""
          new_normalize = """    trips: state.trips.map((trip) =>\n      ['Boarding', 'Delayed', 'Completed'].includes(trip.status)\n        ? { ...trip, status: 'Scheduled' }\n        : trip,\n    ),\n"""
          if old_normalize not in s:
              raise SystemExit('legacy status normalization not found')
          s = s.replace(old_normalize, new_normalize, 1)

          old_valid = """        ![\n          'Scheduled',\n          'Boarding',\n          'Delayed',\n          'Cancelled',\n          'Completed',\n        ].includes(String(action.status))\n"""
          new_valid = """        !['Scheduled', 'Cancelled'].includes(String(action.status))\n"""
          if old_valid not in s:
              raise SystemExit('status action validator not found')
          s = s.replace(old_valid, new_valid, 1)

          old_complete_guard = """      if (\n        action.status === 'Completed' &&\n        current.groups.some((g) => !g.boarded)\n      )\n        throw new Error(\n          'Board all assigned parties before completing this trip.',\n        );\n"""
          if old_complete_guard not in s:
              raise SystemExit('completed status guard not found')
          s = s.replace(old_complete_guard, '', 1)
          p.write_text(s)

          p = Path('components/transport-listing-report.tsx')
          s = p.read_text()
          s = s.replace("  if (status === 'Completed') return 'completed';\n", '', 1)
          s = s.replace("  if (status === 'Delayed') return 'full';\n", '', 1)
          p.write_text(s)
          PY
      - run: npm ci
      - name: Verify transport rules
        run: npm run test:transport
      - name: Verify production build
        run: npm run build:pages
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx lib/transport-state.ts components/transport-listing-report.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Simplify trip status options"
          git push origin main

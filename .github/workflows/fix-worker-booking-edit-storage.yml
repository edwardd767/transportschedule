name: Fix Worker Booking Edit Storage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-worker-booking-edit-storage.yml'
      - 'scripts/fix-worker-booking-edit-storage.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply Worker storage compatibility fix
        run: python scripts/fix-worker-booking-edit-storage.py
      - name: Install dependencies
        run: npm ci
      - name: Verify transport rules and API
        run: npm run test:transport
      - name: Build GitHub Pages site
        run: npm run build:pages
      - name: Build standalone Cloudflare Worker
        run: npm run build:worker
      - name: Verify refreshed Worker bundle
        run: |
          grep -q "normalized-booking-extras-read" worker/hotelx-transport-api.deploy.js
          grep -q "bookingUpdate" worker/hotelx-transport-api.deploy.js
      - name: Commit implementation
        run: |
          git config user.name "Edward Jacob"
          git config user.email "56201541+edwardd767@users.noreply.github.com"
          git add worker/normalized-storage.ts scripts/test-transport-worker.mjs worker/hotelx-transport-api.deploy.js
          git commit -m "Fix Booking Edit Worker storage compatibility"
          git push

name: Refresh Worker Deploy Bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-worker-deploy-bundle.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tests
        run: npm run test:transport
      - name: Refresh Worker bundle
        run: npm run build:worker
      - name: Verify Booking Edit support exists in paste bundle
        run: grep -q "bookingUpdate" worker/hotelx-transport-api.deploy.js
      - name: Commit refreshed paste bundle
        run: |
          git config user.name "Edward Jacob"
          git config user.email "56201541+edwardd767@users.noreply.github.com"
          git add worker/hotelx-transport-api.deploy.js
          if git diff --cached --quiet; then
            echo "Worker paste bundle already current"
          else
            git commit -m "Refresh Cloudflare Worker paste bundle"
            git push
          fi

name: Unified HotelX calendars

on:
  push:
    paths:
      - '.github/workflows/unified-hotel-calendar.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Replace all native calendars
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'app/page.tsx',
              'components/bookings.tsx',
              'components/edit-transport-trip.tsx',
              'components/booking-transfers.tsx',
              'components/schedule-templates.tsx',
              'components/transport-listing-report.tsx',
              'components/month-timetable.tsx',
          ]

          def add_import(path):
              p = Path(path)
              s = p.read_text()
              imp = "import { HotelDatePicker } from '@/components/hotel-date-picker';\n"
              if imp not in s:
                  marker = "'use client';\n"
                  if marker not in s:
                      raise SystemExit(f'{path}: client marker missing')
                  s = s.replace(marker, marker + imp, 1)
              p.write_text(s)

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match in {path}, found {count}')
              p.write_text(s.replace(old, new, 1))

          for path in files:
              add_import(path)

          replace_once(
              'app/page.tsx',
              '''                      <label>\n                        <CalendarDays size={19} />\n                        <input\n                          type="date"\n                          aria-label="Travel date"\n                          value={date}\n                          onChange={(e) =>\n                            e.target.value && setDate(e.target.value)\n                          }\n                        />\n                      </label>''',
              '''                      <HotelDatePicker\n                        value={date}\n                        onChange={setDate}\n                        ariaLabel="Travel date"\n                      />''',
              'Day List travel date',
          )
          replace_once(
              'app/page.tsx',
              '<input type="date" name="date" required defaultValue={date} />',
              '<HotelDatePicker name="date" required defaultValue={date} ariaLabel="Travel date" />',
              'Add Trip date',
          )

          replace_once(
              'components/bookings.tsx',
              '''              <input\n                type="date"\n                value={arrivalDate}\n                onChange={(event) => setArrivalDate(event.target.value)}\n              />''',
              '''              <HotelDatePicker\n                value={arrivalDate}\n                onChange={setArrivalDate}\n                ariaLabel="Arrival date"\n              />''',
              'Booking arrival date',
          )

          replace_once(
              'components/edit-transport-trip.tsx',
              '''              <input\n                type="date"\n                required\n                value={values.date}\n                onChange={(event) =>\n                  setValues({ ...values, date: event.target.value })\n                }\n              />''',
              '''              <HotelDatePicker\n                required\n                value={values.date}\n                onChange={(date) => setValues({ ...values, date })}\n                ariaLabel="Departure date"\n              />''',
              'Edit Departure date',
          )

          replace_once(
              'components/booking-transfers.tsx',
              '''                  <input\n                    type="date"\n                    required\n                    value={travelDate}\n                    onChange={(event) => {\n                      setTravelDate(event.target.value);\n                      setTripId('');\n                    }}\n                  />''',
              '''                  <HotelDatePicker\n                    required\n                    value={travelDate}\n                    onChange={(value) => {\n                      setTravelDate(value);\n                      setTripId('');\n                    }}\n                    ariaLabel="Travel date"\n                  />''',
              'Scheduled booking transport date',
          )
          replace_once(
              'components/booking-transfers.tsx',
              '''                    <input\n                      type="date"\n                      name="date"\n                      required\n                      defaultValue={adding === 'arrival' ? booking.arrival : booking.departure}\n                    />''',
              '''                    <HotelDatePicker\n                      name="date"\n                      required\n                      defaultValue={adding === 'arrival' ? booking.arrival : booking.departure}\n                      ariaLabel="Travel date"\n                    />''',
              'On-demand booking transport date',
          )

          replace_once(
              'components/schedule-templates.tsx',
              '''                  <input\n                    type="date"\n                    required\n                    value={draft.startDate}\n                    onChange={(event) =>\n                      setDraft({ ...draft, startDate: event.target.value })\n                    }\n                  />''',
              '''                  <HotelDatePicker\n                    required\n                    value={draft.startDate}\n                    onChange={(startDate) => setDraft({ ...draft, startDate })}\n                    ariaLabel="Template start date"\n                  />''',
              'Template start date',
          )
          replace_once(
              'components/schedule-templates.tsx',
              '''                  <input\n                    type="date"\n                    required\n                    min={draft.startDate}\n                    value={draft.endDate}\n                    onChange={(event) =>\n                      setDraft({ ...draft, endDate: event.target.value })\n                    }\n                  />''',
              '''                  <HotelDatePicker\n                    required\n                    min={draft.startDate}\n                    value={draft.endDate}\n                    onChange={(endDate) => setDraft({ ...draft, endDate })}\n                    ariaLabel="Template end date"\n                  />''',
              'Template end date',
          )

          replace_once(
              'components/transport-listing-report.tsx',
              '''        <label className="transport-report-date">\n          <CalendarDays size={15} /> From\n          <input type="date" value={fromDate} onChange={(event) => setFromDate(event.target.value)} />\n        </label>''',
              '''        <label className="transport-report-date">\n          From\n          <HotelDatePicker value={fromDate} onChange={setFromDate} ariaLabel="Report from date" />\n        </label>''',
              'Report from date',
          )
          replace_once(
              'components/transport-listing-report.tsx',
              '''        <label className="transport-report-date">\n          <CalendarDays size={15} /> To\n          <input type="date" value={toDate} onChange={(event) => setToDate(event.target.value)} />\n        </label>''',
              '''        <label className="transport-report-date">\n          To\n          <HotelDatePicker value={toDate} onChange={setToDate} ariaLabel="Report to date" />\n        </label>''',
              'Report to date',
          )

          replace_once(
              'components/month-timetable.tsx',
              '''          <label>\n            <span className="sr-only">Timetable month</span>\n            <input\n              type="month"\n              value={month}\n              onChange={(event) =>\n                event.target.value && onMonth(event.target.value)\n              }\n            />\n          </label>''',
              '''          <HotelDatePicker\n            mode="month"\n            value={month}\n            onChange={onMonth}\n            ariaLabel="Timetable month"\n            className="hotel-month-field"\n          />''',
              'Month timetable picker',
          )

          # Make sure the app cannot silently fall back to a browser-specific calendar.
          leftovers = []
          for root in [Path('app'), Path('components')]:
              for p in root.rglob('*.tsx'):
                  text = p.read_text()
                  if 'type="date"' in text or 'type="month"' in text:
                      leftovers.append(str(p))
          if leftovers:
              raise SystemExit('Native calendar inputs remain: ' + ', '.join(sorted(set(leftovers))))
          PY

      - name: Add HotelX calendar styling
        run: |
          cat >> app/globals.css <<'CSS'

          /* Unified HotelX calendar picker */
          .hotel-date-field {
            width: 100%;
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: #292929;
            text-align: left;
            font-weight: 400;
          }
          .hotel-date-field:hover {
            border-color: #d6a15d;
            background: #fffaf3;
          }
          .hotel-date-field > svg {
            color: #5f6670;
          }
          .hotel-month-field {
            min-width: 190px;
          }
          .hotel-calendar-dialog {
            width: min(463px, calc(100vw - 24px)) !important;
            max-width: 463px !important;
            padding: 0 !important;
            gap: 0 !important;
            overflow: hidden;
            border-radius: 4px !important;
            background: #fff;
            box-shadow: 0 18px 60px #0004;
          }
          .hotel-calendar-header {
            min-height: 148px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 22px 34px 20px;
            background: var(--orange);
            color: #fff;
          }
          .hotel-calendar-header small {
            margin-bottom: 8px;
            color: #ffe0b0;
            font-size: 24px;
            font-weight: 400;
          }
          .hotel-calendar-header strong {
            font-size: clamp(36px, 7vw, 48px);
            line-height: 1.05;
            font-weight: 400;
            letter-spacing: -1px;
          }
          .hotel-calendar-monthbar {
            min-height: 76px;
            display: grid;
            grid-template-columns: 54px 1fr 54px;
            align-items: center;
            padding: 4px 16px;
          }
          .hotel-calendar-monthbar > strong {
            text-align: center;
            font-size: 24px;
            font-weight: 400;
          }
          .hotel-calendar-nav {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #767676;
          }
          .hotel-calendar-nav:hover {
            background: #f3f3f3;
          }
          .hotel-calendar-weekdays,
          .hotel-calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            align-items: center;
            padding: 0 20px;
          }
          .hotel-calendar-weekdays {
            min-height: 48px;
            color: #999;
            font-size: 17px;
            text-align: center;
          }
          .hotel-calendar-grid {
            grid-auto-rows: 54px;
            min-height: 324px;
            align-content: start;
          }
          .hotel-calendar-grid > span,
          .hotel-calendar-grid > button {
            justify-self: center;
          }
          .hotel-calendar-grid > button {
            width: 52px;
            height: 52px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #292929;
            font-size: 20px;
            font-weight: 400;
          }
          .hotel-calendar-grid > button:hover:not(:disabled) {
            background: #fff1dc;
          }
          .hotel-calendar-grid > button.selected {
            background: var(--orange);
            color: #fff;
          }
          .hotel-calendar-grid > button:disabled {
            color: #c7c7c7;
            cursor: default;
          }
          .hotel-calendar-actions {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 38px;
            padding: 10px 42px 18px;
          }
          .hotel-calendar-actions button {
            border: 0;
            background: transparent;
            color: var(--orange);
            font-size: 19px;
            font-weight: 600;
          }
          .date-picker > .hotel-date-field {
            min-width: 195px;
            border: 0;
            border-radius: 0;
          }
          .transport-report-date .hotel-date-field {
            min-width: 142px;
          }
          @media (max-width: 560px) {
            .hotel-calendar-header {
              min-height: 126px;
              padding: 18px 26px;
            }
            .hotel-calendar-header small {
              font-size: 20px;
            }
            .hotel-calendar-monthbar > strong {
              font-size: 20px;
            }
            .hotel-calendar-weekdays,
            .hotel-calendar-grid {
              padding-inline: 12px;
            }
            .hotel-calendar-grid {
              grid-auto-rows: 48px;
              min-height: 288px;
            }
            .hotel-calendar-grid > button {
              width: 45px;
              height: 45px;
              font-size: 18px;
            }
            .hotel-calendar-actions {
              min-height: 66px;
              padding: 8px 28px 14px;
            }
          }
          CSS

      - run: npm ci
      - name: Verify no native calendars remain
        run: |
          ! grep -R -n 'type="date"\|type="month"' app components --include='*.tsx'
      - name: Verify transport tests
        run: npm run test:transport
      - name: Verify Pages build
        run: npm run build:pages
      - name: Verify Worker build
        run: npm run build:worker
      - name: Commit unified calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css components/bookings.tsx components/edit-transport-trip.tsx components/booking-transfers.tsx components/schedule-templates.tsx components/transport-listing-report.tsx components/month-timetable.tsx components/hotel-date-picker.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Standardize all HotelX calendar pickers"
          git push origin main

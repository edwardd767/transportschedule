name: Add Security Deposit Policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-security-deposit-policy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Implement Security Deposit Policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Extend persisted operational-policy model.
          p = Path('lib/hotel-masters.ts')
          s = p.read_text()
          old_type = "export type HotelOperationalPolicy = { standardCheckInTime: string; standardCheckOutTime: string; nightAuditCutOffTime: string; postpaid: boolean; floorPlan: boolean; cashierClosure: boolean; occupancy: { houseUse: boolean; dayUse: boolean; complimentary: boolean; ooo: boolean; ooi: boolean } };"
          new_type = "export type HotelSecurityDepositPolicy = { securityDepositAmount: number; keyCardDepositAmount: number; taxSchemeForfeitedRevenue: string; promptDuringWalkIn: boolean; promptDuringPreCheckin: boolean };\nexport type HotelOperationalPolicy = { standardCheckInTime: string; standardCheckOutTime: string; nightAuditCutOffTime: string; postpaid: boolean; floorPlan: boolean; cashierClosure: boolean; occupancy: { houseUse: boolean; dayUse: boolean; complimentary: boolean; ooo: boolean; ooi: boolean }; securityDepositPolicy: HotelSecurityDepositPolicy };"
          if old_type not in s:
              raise SystemExit('HotelOperationalPolicy type pattern not found')
          s = s.replace(old_type, new_type, 1)
          old_initial = "operationalPolicy: { standardCheckInTime: '01:00 PM', standardCheckOutTime: '12:00 PM', nightAuditCutOffTime: '10:00 AM', postpaid: false, floorPlan: false, cashierClosure: false, occupancy: { houseUse: true, dayUse: true, complimentary: true, ooo: false, ooi: false } }"
          new_initial = "operationalPolicy: { standardCheckInTime: '01:00 PM', standardCheckOutTime: '12:00 PM', nightAuditCutOffTime: '10:00 AM', postpaid: false, floorPlan: false, cashierClosure: false, occupancy: { houseUse: true, dayUse: true, complimentary: true, ooo: false, ooi: false }, securityDepositPolicy: { securityDepositAmount: 0, keyCardDepositAmount: 0, taxSchemeForfeitedRevenue: 'SST', promptDuringWalkIn: true, promptDuringPreCheckin: false } }"
          if old_initial not in s:
              raise SystemExit('initial operational policy pattern not found')
          s = s.replace(old_initial, new_initial, 1)
          p.write_text(s)

          # 2) Add navigation + fully functional policy screen.
          p = Path('components/hotel-settings-detail.tsx')
          s = p.read_text()
          old_import = "import { initialHotelProfile, type HotelDepartment, type HotelRoomType, type RoomStatus, type HotelProfile, type HotelOperationalPolicy } from '@/lib/hotel-masters';"
          new_import = "import { initialHotelProfile, type HotelDepartment, type HotelRoomType, type RoomStatus, type HotelProfile, type HotelOperationalPolicy, type HotelSecurityDepositPolicy } from '@/lib/hotel-masters';"
          if old_import not in s:
              raise SystemExit('hotel-masters import pattern not found')
          s = s.replace(old_import, new_import, 1)

          old_nav = "  if (policy === 'Hotel Operational Policy') return <HotelOperationalPolicyModule profile={profile} onProfileChange={onProfileChange} onBack={() => setPolicy(null)} />;\n  if (policy === 'General Policy') return <GeneralPolicyModule profile={profile} onProfileChange={onProfileChange} onBack={() => setPolicy(null)} />;"
          new_nav = "  if (policy === 'Hotel Operational Policy') return <HotelOperationalPolicyModule profile={profile} onProfileChange={onProfileChange} onBack={() => setPolicy(null)} />;\n  if (policy === 'Security Deposit Policy') return <SecurityDepositPolicyModule profile={profile} onProfileChange={onProfileChange} onBack={() => setPolicy(null)} />;\n  if (policy === 'General Policy') return <GeneralPolicyModule profile={profile} onProfileChange={onProfileChange} onBack={() => setPolicy(null)} />;"
          if old_nav not in s:
              raise SystemExit('StandardPolicyModule navigation pattern not found')
          s = s.replace(old_nav, new_nav, 1)

          old_click = "onClick={() => (item === 'General Policy' || item === 'Hotel Operational Policy') && setPolicy(item)}"
          new_click = "onClick={() => (item === 'General Policy' || item === 'Hotel Operational Policy' || item === 'Security Deposit Policy') && setPolicy(item)}"
          if old_click not in s:
              raise SystemExit('Standard Policy click pattern not found')
          s = s.replace(old_click, new_click, 1)

          anchor = "\nfunction HotelOperationalPolicyModule("
          if anchor not in s:
              raise SystemExit('HotelOperationalPolicyModule anchor not found')
          security_component = r'''
function SecurityDepositPolicyModule({ onBack, profile, onProfileChange }: { onBack: () => void; profile: HotelProfile; onProfileChange: (value: HotelProfile) => void | Promise<void> }) {
  const defaults = initialHotelProfile.operationalPolicy.securityDepositPolicy;
  const saved: HotelSecurityDepositPolicy = { ...defaults, ...(profile.operationalPolicy?.securityDepositPolicy || {}) };
  const [securityDepositAmount, setSecurityDepositAmount] = useState(saved.securityDepositAmount.toFixed(2));
  const [keyCardDepositAmount, setKeyCardDepositAmount] = useState(saved.keyCardDepositAmount.toFixed(2));
  const [taxSchemeForfeitedRevenue, setTaxSchemeForfeitedRevenue] = useState(saved.taxSchemeForfeitedRevenue || 'SST');
  const [promptDuringWalkIn, setPromptDuringWalkIn] = useState(saved.promptDuringWalkIn);
  const [promptDuringPreCheckin, setPromptDuringPreCheckin] = useState(saved.promptDuringPreCheckin);

  const dirty = securityDepositAmount !== saved.securityDepositAmount.toFixed(2)
    || keyCardDepositAmount !== saved.keyCardDepositAmount.toFixed(2)
    || taxSchemeForfeitedRevenue !== saved.taxSchemeForfeitedRevenue
    || promptDuringWalkIn !== saved.promptDuringWalkIn
    || promptDuringPreCheckin !== saved.promptDuringPreCheckin;

  const cleanAmount = (value: string) => {
    const next = value.replace(/[^0-9.]/g, '');
    const firstDot = next.indexOf('.');
    return firstDot < 0 ? next : next.slice(0, firstDot + 1) + next.slice(firstDot + 1).replace(/\./g, '');
  };
  const amountField = (label: string, value: string, setValue: (next: string) => void) => (
    <label className="security-deposit-field">
      <span>{label} *</span>
      <input inputMode="decimal" value={value} onChange={(event) => setValue(cleanAmount(event.target.value))} onBlur={() => setValue((Number.parseFloat(value || '0') || 0).toFixed(2))} />
    </label>
  );
  const switchField = (label: string, checked: boolean, onChange: () => void) => (
    <button type="button" className={`security-deposit-switch ${checked ? 'is-on' : ''}`} onClick={onChange}>
      <span>{label}</span><i aria-hidden="true" />
    </button>
  );

  return <section className="master-page security-deposit-page" aria-label="Security Deposit Policy">
    <div className="operational-policy-head"><strong>Security Deposit Policy</strong><button type="button">Edit</button></div>
    <div className="security-deposit-card">
      {amountField('Security Deposit Amt', securityDepositAmount, setSecurityDepositAmount)}
      {amountField('Key Card Deposit Amt', keyCardDepositAmount, setKeyCardDepositAmount)}
      <label className="security-deposit-field security-deposit-select">
        <span>Tax Scheme Forfeited Revenue</span>
        <select value={taxSchemeForfeitedRevenue} onChange={(event) => setTaxSchemeForfeitedRevenue(event.target.value)}>
          <option value="SST">SST</option>
          <option value="No Tax">No Tax</option>
        </select>
      </label>
      {switchField('Prompt during Walk-in', promptDuringWalkIn, () => setPromptDuringWalkIn((value) => !value))}
      {switchField('Prompt during Pre Checkin', promptDuringPreCheckin, () => setPromptDuringPreCheckin((value) => !value))}
    </div>
    <div className="master-page-actions security-deposit-actions">
      <button className="primary-button" type="button" disabled={!dirty} onClick={async () => {
        const securityDepositPolicy: HotelSecurityDepositPolicy = {
          securityDepositAmount: Number.parseFloat(securityDepositAmount || '0') || 0,
          keyCardDepositAmount: Number.parseFloat(keyCardDepositAmount || '0') || 0,
          taxSchemeForfeitedRevenue,
          promptDuringWalkIn,
          promptDuringPreCheckin,
        };
        await onProfileChange({ ...profile, operationalPolicy: { ...initialHotelProfile.operationalPolicy, ...profile.operationalPolicy, occupancy: { ...initialHotelProfile.operationalPolicy.occupancy, ...(profile.operationalPolicy?.occupancy || {}) }, securityDepositPolicy } });
      }}>Save</button>
    </div>
  </section>;
}
'''
          s = s.replace(anchor, '\n' + security_component + anchor, 1)

          # Keep old saved profiles compatible when this nested object did not exist yet.
          old_draft = "  const [draft, setDraft] = useState<HotelOperationalPolicy>({ ...defaultPolicy, ...savedPolicy, occupancy: { ...defaultPolicy.occupancy, ...(savedPolicy.occupancy || {}) } });"
          new_draft = "  const [draft, setDraft] = useState<HotelOperationalPolicy>({ ...defaultPolicy, ...savedPolicy, occupancy: { ...defaultPolicy.occupancy, ...(savedPolicy.occupancy || {}) }, securityDepositPolicy: { ...defaultPolicy.securityDepositPolicy, ...(savedPolicy.securityDepositPolicy || {}) } });"
          if old_draft not in s:
              raise SystemExit('Operational Policy draft pattern not found')
          s = s.replace(old_draft, new_draft, 1)
          p.write_text(s)

          # 3) Match the HotelX screenshot styling and fixed Save bar.
          p = Path('app/globals.css')
          c = p.read_text().rstrip()
          marker = '/* HotelX Security Deposit Policy */'
          block = r'''

/* HotelX Security Deposit Policy */
.security-deposit-page{padding-bottom:94px}
.security-deposit-card{margin-top:8px;padding:12px 12px 10px;background:#fff;border-radius:4px;box-shadow:0 2px 6px #0002}
.security-deposit-field{display:flex;flex-direction:column;gap:4px;padding:7px 0 9px;color:#7b8595;font-size:12px;font-weight:400}
.security-deposit-field input,.security-deposit-field select{width:100%;height:31px;min-height:31px;padding:0;border:0;border-bottom:1px solid #9f9f9f;border-radius:0;outline:0;background:#fff;color:#111;font-family:inherit;font-size:15px;font-weight:400}
.security-deposit-field input:focus,.security-deposit-field select:focus{border-bottom-color:#f79400}
.security-deposit-select select{appearance:auto;padding-right:6px}
.security-deposit-switch{width:100%;height:46px;padding:0;border:0;background:transparent;color:#111;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:15px;font-weight:400}
.security-deposit-switch i{width:35px;height:18px;border-radius:12px;background:#aaa;position:relative;transition:.2s;flex:none}
.security-deposit-switch i:after{content:'';position:absolute;width:20px;height:20px;top:-1px;left:0;border-radius:50%;background:#f7f7f7;box-shadow:0 1px 2px #0002;transition:.2s}
.security-deposit-switch.is-on i{background:#ffb52c}
.security-deposit-switch.is-on i:after{left:15px;background:#ff8d00}
.security-deposit-page>.security-deposit-actions{position:fixed;left:197px;right:0;bottom:0;height:74px;min-height:74px;margin:0;padding:10px 20px;background:#fff;box-shadow:0 -2px 7px #0002;z-index:20;display:flex;align-items:center;justify-content:center}
.security-deposit-actions .primary-button{min-width:126px;height:40px;border-radius:4px;font-size:13px}
.security-deposit-actions .primary-button:disabled{background:#ddd;color:#aaa;opacity:1}
@media(max-width:700px){.security-deposit-page{padding-bottom:84px}.security-deposit-page>.security-deposit-actions{left:0;height:68px;min-height:68px;padding:10px 12px}.security-deposit-card{margin-top:8px}}
'''
          if marker in c:
              start = c.index(marker)
              next_marker = c.find('\n/* ', start + len(marker))
              if next_marker == -1:
                  c = c[:start].rstrip() + block
              else:
                  c = c[:start] + block + c[next_marker:]
          else:
              c += block
          p.write_text(c)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: |
          npm run build:pages
          npm run test:transport
      - name: Commit Security Deposit Policy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/hotel-masters.ts components/hotel-settings-detail.tsx app/globals.css
          git commit -m 'Implement Security Deposit Policy' || exit 0
          git push

name: Add Security Deposit Policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-security-deposit-policy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Implement Security Deposit Policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          component = base64.b64decode('').decode()
          css_block = base64.b64decode('').decode()

          p = Path('components/hotel-settings-detail.tsx')
          s = p.read_text()
          nav = "  if (policy === 'Hotel Operational Policy') return <HotelOperationalPolicyModule profile={profile} onProfileChange={onProfileChange} onBack={() => setPolicy(null)} />;\n"
          if "policy === 'Security Deposit Policy'" not in s:
              if nav not in s: raise SystemExit('navigation anchor missing')
              s = s.replace(nav, nav + "  if (policy === 'Security Deposit Policy') return <SecurityDepositPolicyModule profile={profile} onProfileChange={onProfileChange} />;\n", 1)
          old_click = "onClick={() => (item === 'General Policy' || item === 'Hotel Operational Policy') && setPolicy(item)}"
          if old_click in s:
              s = s.replace(old_click, "onClick={() => (item === 'General Policy' || item === 'Hotel Operational Policy' || item === 'Security Deposit Policy') && setPolicy(item)}", 1)
          if 'function SecurityDepositPolicyModule' not in s:
              anchor = '\nfunction HotelOperationalPolicyModule('
              if anchor not in s: raise SystemExit('component anchor missing')
              s = s.replace(anchor, component + anchor, 1)
          p.write_text(s)

          p = Path('app/globals.css')
          c = p.read_text()
          if '/* HotelX Security Deposit Policy */' not in c:
              c = c.rstrip() + css_block
          p.write_text(c)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: |
          npm run build:pages
          npm run test:transport
      - name: Commit Security Deposit Policy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/hotel-settings-detail.tsx app/globals.css
          git commit -m 'Implement Security Deposit Policy' || exit 0
          git push

name: Fix Transport Setup actions

on:
  push:
    paths:
      - '.github/workflows/fix-setup-actions.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Restore setup dialog Save icon
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/transport-setup.tsx')
          s = p.read_text()
          old = "  Plus,\n  Settings2,\n"
          new = "  Plus,\n  Save,\n  Settings2,\n"
          if old not in s:
              raise SystemExit('Transport Setup import block not found')
          if "  Save,\n  Settings2,\n" not in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - name: Check Transport Setup component
        run: npx oxlint components/transport-setup.tsx
      - name: Verify transport rules
        run: npm run test:transport
      - name: Verify production build
        run: npm run build:pages
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/transport-setup.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix add service and operator dialogs"
          git push origin main

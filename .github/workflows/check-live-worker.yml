name: Check Live Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-live-worker.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check health endpoint
        run: |
          set -x
          curl -i --fail-with-body --max-time 20 https://hotelx-transport-api.edwardjacob721.workers.dev/health
      - name: Check state endpoint without auth
        run: |
          set -x
          curl -i --max-time 20 https://hotelx-transport-api.edwardjacob721.workers.dev/state

name: Retry booking transport upgrade

on:
  push:
    paths:
      - '.github/workflows/multimodal-booking-upgrade-fix.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Recover and fix upgrade script
        shell: bash
        run: |
          sed -n "/cat > \/tmp\/upgrade.b64 <<'PAYLOAD'/,/^[[:space:]]*PAYLOAD$/p" .github/workflows/multimodal-booking-upgrade.yml \
            | sed '1d;$d;s/^[[:space:]]*//' > /tmp/upgrade.b64
          base64 -d /tmp/upgrade.b64 | gzip -d > /tmp/upgrade.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/upgrade.py')
          text = path.read_text()
          text = text.replace('label="Service operator""""', 'label="Service operator"""')
          path.write_text(text)
          compile(text, str(path), 'exec')
          PY
          python /tmp/upgrade.py
      - name: Install dependencies
        run: npm ci
      - name: Verify transport rules
        run: npm run test:transport
      - name: Verify Pages build
        run: npm run build:pages
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/booking-transfers.tsx components/transport-setup.tsx lib/booking-transport.ts lib/transport.ts lib/transport-state.ts lib/use-transport-data.ts worker/index.ts README.md
          git diff --cached --quiet && exit 0
          git commit -m "Support scheduled and on-demand booking transport"
          git push origin main

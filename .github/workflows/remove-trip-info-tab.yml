name: Remove Trip Information tab

on:
  push:
    paths:
      - '.github/workflows/remove-trip-info-tab.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Remove Trip Information tab
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/page.tsx')
          s = p.read_text()

          old_import = "import { Tabs, TabsList, TabsTrigger, TabsContent } from '@/components/ui/tabs';\n"
          if old_import not in s:
              raise SystemExit('Tabs import not found')
          s = s.replace(old_import, '', 1)

          start_marker = '                <Tabs defaultValue="passengers" className="detail-tabs">\n'
          passenger_marker = '                  <TabsContent value="passengers">\n'
          split_marker = '                  </TabsContent>\n                  <TabsContent value="information">\n'
          end_marker = '                  </TabsContent>\n                </Tabs>'

          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('Trip detail tabs start not found')
          passenger_start = s.find(passenger_marker, start)
          if passenger_start < 0:
              raise SystemExit('Passengers tab content not found')
          passenger_start += len(passenger_marker)
          split = s.find(split_marker, passenger_start)
          if split < 0:
              raise SystemExit('Trip information tab boundary not found')
          end = s.find(end_marker, split + len(split_marker))
          if end < 0:
              raise SystemExit('Trip detail tabs end not found')
          end += len(end_marker)

          passenger_content = s[passenger_start:split]
          replacement = '                <div className="detail-tabs">\n' + passenger_content + '                </div>'
          s = s[:start] + replacement + s[end:]

          if 'Trip information' in s or 'value="information"' in s:
              raise SystemExit('Trip Information tab was not fully removed')

          p.write_text(s)
          PY
      - run: npm ci
      - name: Verify transport rules
        run: npm run test:transport
      - name: Verify production build
        run: npm run build:pages
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove Trip Information tab"
          git push origin main

name: Billing add-on order

on:
  push:
    paths:
      - '.github/workflows/billing-addon-order.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Move add-ons to end of Billing Schedule breakdown
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/billing-schedule.tsx')
          s = p.read_text()
          old = "{line.elements.map((e,i) => <small key={`element-${i}`}>{e.name}</small>)}{line.addOns.map((item, index) => <small key={`addon-${index}`}>Add On - {item.name}</small>)}{line.extraPax > 0 && <small>Extra Pax</small>}"
          new = "{line.elements.map((e,i) => <small key={`element-${i}`}>{e.name}</small>)}{line.extraPax > 0 && <small>Extra Pax</small>}{line.addOns.map((item, index) => <small key={`addon-${index}`}>Add On - {item.name}</small>)}"
          old_values = "{line.elements.map((e,i) => <small key={`element-${i}`}>{money(e.amount)}</small>)}{line.addOns.map((item, index) => <small key={`addon-${index}`}>{money(item.amount)}</small>)}{line.extraPax > 0 && <small>{money(line.extraPax)}</small>}"
          new_values = "{line.elements.map((e,i) => <small key={`element-${i}`}>{money(e.amount)}</small>)}{line.extraPax > 0 && <small>{money(line.extraPax)}</small>}{line.addOns.map((item, index) => <small key={`addon-${index}`}>{money(item.amount)}</small>)}"
          if old not in s or old_values not in s:
              raise SystemExit('Expected Billing Schedule breakdown pattern not found')
          s = s.replace(old, new, 1).replace(old_values, new_values, 1)
          p.write_text(s)
          PY
      - name: Commit Billing Schedule order
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/billing-schedule.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Show Billing Schedule add-ons last"
          git push origin main

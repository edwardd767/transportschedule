name: HotelX master files upgrade

on:
  push:
    paths:
      - '.github/workflows/hotel-master-files-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply HotelX master file upgrade
        run: python scripts/apply-hotel-master-upgrade.py
      - run: npm ci
      - name: Verify transport tests
        run: npm run test:transport
      - name: Verify Pages build
        run: npm run build:pages
      - name: Verify Worker build
        run: npm run build:worker
      - name: Refresh deployable Worker bundle
        run: cp dist/worker/hotelx-transport-api.js worker/hotelx-transport-api.deploy.js
      - name: Commit Hotel master files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib worker scripts
          git diff --cached --quiet && exit 0
          git commit -m "Add HotelX location room type and room masters"
          git push origin main

name: Hotel Settings menu

on:
  push:
    paths:
      - '.github/workflows/hotel-settings-menu.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply Hotel Settings menu patch
        run: python .github/scripts/hotel_settings_menu_patch.py
      - run: npm ci
      - name: Verify transport tests
        run: npm run test:transport
      - name: Verify Pages build
        run: npm run build:pages
      - name: Verify Worker build
        run: npm run build:worker
      - name: Commit Hotel Settings menu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css components/hotel-settings-menu.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add Hotel Settings menu before Transport Setup"
          git push origin main

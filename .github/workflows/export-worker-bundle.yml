name: Export Worker bundle

on:
  push:
    paths:
      - '.github/workflows/export-worker-bundle.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:worker
      - name: Export deployable Worker
        run: |
          cp dist/worker/hotelx-transport-api.js worker/hotelx-transport-api.deploy.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/hotelx-transport-api.deploy.js
          git commit -m "Export deployable Cloudflare Worker bundle"
          git push origin main

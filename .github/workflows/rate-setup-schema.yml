name: Rate Setup database schema

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rate-setup-schema.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Rate Setup schema
        run: python scripts/apply-rate-setup-schema.py

      - name: Install dependencies
        run: npm ci

      - name: Verify transport rules and API
        run: npm run test:transport

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Build standalone Cloudflare Worker
        run: npm run build:worker

      - name: Commit schema update
        shell: bash
        run: |
          rm .github/workflows/rate-setup-schema.yml scripts/apply-rate-setup-schema.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/normalized-storage.ts worker/index.ts scripts/test-transport-worker.mjs database/rate-setup-schema.sql worker/hotelx-transport-api.deploy.js .github/workflows/rate-setup-schema.yml scripts/apply-rate-setup-schema.py
          git commit -m 'Add HotelX Rate Setup database tables'
          git push origin HEAD:main

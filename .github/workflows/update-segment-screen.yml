name: Update Segment screen

on:
  push:
    paths:
      - '.github/workflows/update-segment-screen.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Apply Segment screen patch
        run: |
          echo '' | base64 -d > /tmp/segment_patch.py
          python /tmp/segment_patch.py

      - name: Verify build
        run: |
          npm ci
          npm run build:pages

      - name: Commit Segment screen changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m "Match HotelX Segment header and navigation"
          git push origin main

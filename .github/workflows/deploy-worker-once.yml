name: Deploy Cloudflare Worker Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-worker-once.yml'

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Worker
        run: npm run build:worker
      - name: Deploy Worker when credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_DEPLOY_SKIPPED: repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 0
          fi
          npx wrangler deploy --config worker/wrangler.jsonc

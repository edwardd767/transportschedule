name: Transport UI cleanup v2

on:
  push:
    paths:
      - '.github/workflows/transport-ui-cleanup-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply requested changes
        run: python .github/scripts/transport_ui_cleanup.py
      - run: npm ci
      - name: Verify transport rules
        run: npm run test:transport
      - name: Verify Pages build
        run: npm run build:pages
      - name: Commit requested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/month-timetable.tsx components/transport-setup.tsx components/schedule-templates.tsx app/page.tsx README.md
          git diff --cached --quiet && exit 0
          git commit -m "Simplify calendar setup and schedule templates"
          git push origin main

name: Add booking occupancy fields

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-booking-occupancy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply booking occupancy fields
        run: python -c "import base64; exec(base64.b64decode(''))"

      - name: Install dependencies
        run: npm ci

      - name: Verify transport rules and API
        run: npm run test:transport

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Build standalone Cloudflare Worker
        run: npm run build:worker

      - name: Commit update
        shell: bash
        run: |
          rm .github/workflows/add-booking-occupancy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/bookings.tsx app/globals.css .github/workflows/add-booking-occupancy.yml
          git commit -m 'Add adult child and infant booking fields'
          git push origin HEAD:main

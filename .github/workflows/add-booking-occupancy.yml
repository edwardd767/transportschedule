name: Add booking occupancy fields

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-booking-occupancy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply booking occupancy fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/bookings.tsx')
          text = path.read_text()

          old = """    const roomCountValue = Number(form.get('roomCount'));
    const guests = Number(form.get('guests'));
    const amount = Number(form.get('amount'));
    try {
      setCreating(true);
      setCreateError('');
"""
          new = """    const roomCountValue = Number(form.get('roomCount'));
    const adults = Number(form.get('adults'));
    const children = Number(form.get('children'));
    const infants = Number(form.get('infants'));
    const guests = adults + children + infants;
    const amount = Number(form.get('amount'));
    try {
      setCreating(true);
      setCreateError('');
      if (!Number.isSafeInteger(adults) || adults < 1)
        throw new Error('Enter at least 1 adult.');
      if (!Number.isSafeInteger(children) || children < 0)
        throw new Error('Enter a valid number of children.');
      if (!Number.isSafeInteger(infants) || infants < 0)
        throw new Error('Enter a valid number of infants.');
"""
          if old not in text:
              raise SystemExit('Booking calculation block not found')
          text = text.replace(old, new, 1)

          old = """            <div className=\"two-col\">
              <label>No. of rooms<input type=\"number\" name=\"roomCount\" min=\"1\" defaultValue=\"1\" required /></label>
              <label>No. of guests<input type=\"number\" name=\"guests\" min=\"1\" defaultValue=\"1\" required /></label>
            </div>
"""
          new = """            <div className=\"booking-guest-columns\">
              <label>No. of Rooms<input type=\"number\" name=\"roomCount\" min=\"1\" defaultValue=\"1\" required /></label>
              <label>No. of Adult<input type=\"number\" name=\"adults\" min=\"1\" defaultValue=\"1\" required /></label>
              <label>No. of Child<input type=\"number\" name=\"children\" min=\"0\" defaultValue=\"0\" required /></label>
              <label>No. of Infant<input type=\"number\" name=\"infants\" min=\"0\" defaultValue=\"0\" required /></label>
            </div>
"""
          if old not in text:
              raise SystemExit('Booking guest field block not found')
          path.write_text(text.replace(old, new, 1))

          css_path = Path('app/globals.css')
          css = css_path.read_text()
          old = ".booking-create-dialog { width:min(560px,calc(100vw - 24px)) !important; max-width:560px !important; }\n.booking-create-dialog .dialog-form { display:flex; flex-direction:column; gap:14px; }\n.booking-create-dialog .dialog-form > label,.booking-create-dialog .two-col > label { display:flex; flex-direction:column; gap:6px; color:#60666f; font-size:13px; }\n.booking-create-dialog input { min-height:38px; padding:7px 9px; border:1px solid #dedee2; border-radius:6px; background:#fff; color:#222; }\n.booking-create-dialog .two-col { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }"
          new = ".booking-create-dialog { width:min(640px,calc(100vw - 24px)) !important; max-width:640px !important; }\n.booking-create-dialog .dialog-form { display:flex; flex-direction:column; gap:14px; }\n.booking-create-dialog .dialog-form > label,.booking-create-dialog .two-col > label,.booking-create-dialog .booking-guest-columns > label { display:flex; flex-direction:column; gap:6px; color:#60666f; font-size:13px; }\n.booking-create-dialog input { min-height:38px; padding:7px 9px; border:1px solid #dedee2; border-radius:6px; background:#fff; color:#222; }\n.booking-create-dialog .two-col { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }\n.booking-create-dialog .booking-guest-columns { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }"
          if old not in css:
              raise SystemExit('Booking dialog CSS block not found')
          css = css.replace(old, new, 1)
          old = "  .booking-create-dialog .two-col { grid-template-columns:1fr; }\n}"
          new = "  .booking-create-dialog .two-col { grid-template-columns:1fr; }\n  .booking-create-dialog .booking-guest-columns { grid-template-columns:repeat(2,minmax(0,1fr)); }\n}"
          if old not in css:
              raise SystemExit('Booking mobile CSS block not found')
          css_path.write_text(css.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify transport rules and API
        run: npm run test:transport

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Build standalone Cloudflare Worker
        run: npm run build:worker

      - name: Commit update
        shell: bash
        run: |
          rm .github/workflows/add-booking-occupancy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/bookings.tsx app/globals.css .github/workflows/add-booking-occupancy.yml
          git commit -m 'Add adult child and infant booking fields'
          git push origin HEAD:main

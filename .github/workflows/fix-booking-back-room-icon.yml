name: Fix Booking back and room icon

on:
  push:
    paths:
      - '.github/workflows/fix-booking-back-room-icon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Fix Booking nested back and HotelX room icon
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/page.tsx')
          s = p.read_text()
          old = "                onClick={() => bookingEditing ? setBookingEditing(false) : setBookingReference(null)}\n"
          new = "                onClick={() => {\n                  const bookingBackEvent = new Event('hotelx-booking-back', { cancelable: true });\n                  window.dispatchEvent(bookingBackEvent);\n                  if (bookingBackEvent.defaultPrevented) return;\n                  bookingEditing ? setBookingEditing(false) : setBookingReference(null);\n                }}\n"
          if old not in s:
              raise SystemExit('Booking header back handler not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('components/bookings.tsx')
          s = p.read_text()
          marker = "type AdvanceSelectOption = { value: string; label: string };\n\n"
          room_icon_block = "const HOTELX_ROOM_ICON = 'https://hms1.hotelx.asia/static/media/door-subinfoline.44af6263.svg';\n\nfunction RoomIcon({ size = 18 }: { size?: number }) {\n  return <img src={HOTELX_ROOM_ICON} alt=\"\" aria-hidden=\"true\" width={size} height={size} style={{ width: size, height: size, display: 'inline-block', objectFit: 'contain', flex: '0 0 auto' }} />;\n}\n\n"
          if 'HOTELX_ROOM_ICON' not in s:
              if marker not in s:
                  raise SystemExit('Bookings RoomIcon insertion marker not found')
              s = s.replace(marker, marker + room_icon_block, 1)
          s = s.replace('<DoorClosed size={18} aria-hidden="true" />', '<RoomIcon size={18} />')

          back_marker = "  }, [booking]);\n\n\n  function openBooking(item: Booking) {"
          back_effect = "  }, [booking]);\n\n  useEffect(() => {\n    const handleBookingBack = (event: Event) => {\n      if (billingOpen) {\n        event.preventDefault();\n        setBillingOpen(false);\n        return;\n      }\n      if (billingInstructionOpen) {\n        event.preventDefault();\n        setBillingInstructionOpen(false);\n        return;\n      }\n      if (specialRequestOpen) {\n        event.preventDefault();\n        setSpecialRequestOpen(false);\n        return;\n      }\n      if (attachmentsOpen) {\n        event.preventDefault();\n        setAttachmentsOpen(false);\n        return;\n      }\n      if (roomingOpen) {\n        event.preventDefault();\n        setRoomingOpen(false);\n      }\n    };\n    window.addEventListener('hotelx-booking-back', handleBookingBack);\n    return () => window.removeEventListener('hotelx-booking-back', handleBookingBack);\n  }, [attachmentsOpen, billingInstructionOpen, billingOpen, roomingOpen, specialRequestOpen]);\n\n\n  function openBooking(item: Booking) {"
          if 'hotelx-booking-back' not in s:
              if back_marker not in s:
                  raise SystemExit('Bookings back effect insertion marker not found')
              s = s.replace(back_marker, back_effect, 1)
          p.write_text(s)

          p = Path('components/billing-schedule.tsx')
          s = p.read_text()
          icon_marker = "const inputDateLabel = (value: string) => {\n  const [year, month, day] = value.split('-');\n  return `${day}/${month}/${year}`;\n};\n\n"
          icon_block = "const HOTELX_ROOM_ICON = 'https://hms1.hotelx.asia/static/media/door-subinfoline.44af6263.svg';\n\nfunction RoomIcon({ size = 14 }: { size?: number }) {\n  return <img src={HOTELX_ROOM_ICON} alt=\"\" aria-hidden=\"true\" width={size} height={size} style={{ width: size, height: size, display: 'inline-block', objectFit: 'contain', flex: '0 0 auto' }} />;\n}\n\n"
          if 'HOTELX_ROOM_ICON' not in s:
              if icon_marker not in s:
                  raise SystemExit('Billing RoomIcon insertion marker not found')
              s = s.replace(icon_marker, icon_marker + icon_block, 1)
          s = s.replace('<DoorClosed size={14} />', '<RoomIcon size={14} />')
          s = s.replace('<DoorClosed size={16} />', '<RoomIcon size={16} />')
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build:pages
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/bookings.tsx components/billing-schedule.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix Booking back navigation and HotelX room icon"
          git push origin main

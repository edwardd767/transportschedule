name: Fix Booking back and room icon

on:
  push:
    paths:
      - '.github/workflows/fix-booking-back-room-icon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Fix Booking nested back and HotelX room icon
        run: |
          python - <<'PY'
          from pathlib import Path

          # Parent orange-header Back button: let Booking nested pages consume Back first.
          p = Path('app/page.tsx')
          s = p.read_text()
          old = "                onClick={() => bookingEditing ? setBookingEditing(false) : setBookingReference(null)}\n"
          new = """                onClick={() => {
                  const bookingBackEvent = new Event('hotelx-booking-back', { cancelable: true });
                  window.dispatchEvent(bookingBackEvent);
                  if (bookingBackEvent.defaultPrevented) return;
                  bookingEditing ? setBookingEditing(false) : setBookingReference(null);
                }}
"""
          if old not in s:
              raise SystemExit('Booking header back handler not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Booking nested pages consume the parent Back request before returning to listing.
          p = Path('components/bookings.tsx')
          s = p.read_text()
          room_icon_block = """
const HOTELX_ROOM_ICON = 'https://hms1.hotelx.asia/static/media/door-subinfoline.44af6263.svg';

function RoomIcon({ size = 18 }: { size?: number }) {
  return <img src={HOTELX_ROOM_ICON} alt="" aria-hidden="true" width={size} height={size} style={{ width: size, height: size, display: 'inline-block', objectFit: 'contain', flex: '0 0 auto' }} />;
}

"""
          marker = "type AdvanceSelectOption = { value: string; label: string };\n\n"
          if 'HOTELX_ROOM_ICON' not in s:
              if marker not in s:
                  raise SystemExit('Bookings RoomIcon insertion marker not found')
              s = s.replace(marker, marker + room_icon_block, 1)
          old_icon = '<DoorClosed size={18} aria-hidden="true" />'
          if old_icon in s:
              s = s.replace(old_icon, '<RoomIcon size={18} />')

          back_marker = "  }, [booking]);\n\n\n  function openBooking(item: Booking) {"
          back_effect = """  }, [booking]);

  useEffect(() => {
    const handleBookingBack = (event: Event) => {
      if (billingOpen) {
        event.preventDefault();
        setBillingOpen(false);
        return;
      }
      if (billingInstructionOpen) {
        event.preventDefault();
        setBillingInstructionOpen(false);
        return;
      }
      if (specialRequestOpen) {
        event.preventDefault();
        setSpecialRequestOpen(false);
        return;
      }
      if (attachmentsOpen) {
        event.preventDefault();
        setAttachmentsOpen(false);
        return;
      }
      if (roomingOpen) {
        event.preventDefault();
        setRoomingOpen(false);
      }
    };
    window.addEventListener('hotelx-booking-back', handleBookingBack);
    return () => window.removeEventListener('hotelx-booking-back', handleBookingBack);
  }, [attachmentsOpen, billingInstructionOpen, billingOpen, roomingOpen, specialRequestOpen]);


  function openBooking(item: Booking) {"""
          if 'hotelx-booking-back' not in s:
              if back_marker not in s:
                  raise SystemExit('Bookings back effect insertion marker not found')
              s = s.replace(back_marker, back_effect, 1)
          p.write_text(s)

          # Billing Schedule: use the exact HotelX room/door sub-info SVG.
          p = Path('components/billing-schedule.tsx')
          s = p.read_text()
          icon_marker = "const inputDateLabel = (value: string) => {\n  const [year, month, day] = value.split('-');\n  return `${day}/${month}/${year}`;\n};\n\n"
          icon_block = """const HOTELX_ROOM_ICON = 'https://hms1.hotelx.asia/static/media/door-subinfoline.44af6263.svg';

function RoomIcon({ size = 14 }: { size?: number }) {
  return <img src={HOTELX_ROOM_ICON} alt="" aria-hidden="true" width={size} height={size} style={{ width: size, height: size, display: 'inline-block', objectFit: 'contain', flex: '0 0 auto' }} />;
}

"""
          if 'HOTELX_ROOM_ICON' not in s:
              if icon_marker not in s:
                  raise SystemExit('Billing RoomIcon insertion marker not found')
              s = s.replace(icon_marker, icon_marker + icon_block, 1)
          s = s.replace('<DoorClosed size={14} />', '<RoomIcon size={14} />')
          s = s.replace('<DoorClosed size={16} />', '<RoomIcon size={16} />')
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build:pages
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/bookings.tsx components/billing-schedule.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix Booking back navigation and HotelX room icon"
          git push origin main

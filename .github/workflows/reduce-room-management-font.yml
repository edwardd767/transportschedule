name: Reduce Room Management font

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reduce-room-management-font.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Reduce Room Management label font size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/housekeeping-bridge.tsx')
          s = p.read_text()
          old = 'className="flex min-h-[58px] flex-col items-center justify-center gap-1 rounded-[5px] border border-[#ddd] bg-white text-[11px] font-bold shadow-sm hover:bg-[#fff8ef]"'
          new = 'className="flex min-h-[58px] flex-col items-center justify-center gap-1 rounded-[5px] border border-[#ddd] bg-white text-[10px] font-bold shadow-sm hover:bg-[#fff8ef]"'
          if old not in s:
              raise SystemExit('Room Management button font class not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: |
          npm run build:pages
          npm run test:transport
      - name: Commit smaller Room Management font
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/housekeeping-bridge.tsx
          git commit -m 'Reduce Room Management button font size' || exit 0
          git push
